<template data-page="getting-started/quickstart" data-lang="pt"
  data-lead="Do clone ao primeiro GET /health: ambiente virtual, dependências, variáveis de ambiente e os dois serviços rodando na sua máquina.">
  <h2>1. Atualize o projeto</h2>
  <p>Comece na branch certa e com o código em dia. Crie a sua branch a partir de <code>production</code>.</p>
  <pre data-lang="bash"><code>
git checkout production
git pull
git checkout -b nome-da-sua-branch
</code></pre>

  <h2>2. Crie o ambiente virtual</h2>
  <div class="callout" data-kind="info"><p><strong>Requisito.</strong> Use a versão do Python fixada em <code>.python-version</code>. Outras versões podem instalar, mas não são testadas.</p></div>
  <pre data-lang="bash"><code>
python -m venv .venv
</code></pre>

  <h2>3. Ative o ambiente virtual</h2>
  <div class="tabs">
    <div data-tab="PowerShell">
      <pre data-lang="bash"><code>
.\.venv\Scripts\Activate.ps1
</code></pre>
    </div>
    <div data-tab="CMD">
      <pre data-lang="bash"><code>
.venv\Scripts\activate.bat
</code></pre>
    </div>
    <div data-tab="macOS e Linux">
      <pre data-lang="bash"><code>
source .venv/bin/activate
</code></pre>
    </div>
  </div>
  <p>Depois de ativar, o prompt do terminal passa a começar com <code>(.venv)</code>.</p>

  <h2>4. Instale as dependências</h2>
  <p>O <code>uv</code> é a fonte da verdade para as dependências. Ele lê o <code>pyproject.toml</code> e o <code>uv.lock</code>.</p>
  <pre data-lang="bash"><code>
uv sync
</code></pre>

  <h2>5. Configure as variáveis de ambiente</h2>
  <p>Crie um arquivo <code>.env</code> na raiz do projeto. Estas são as variáveis que mais importam para subir a API:</p>
  <table>
    <thead><tr><th>Variável</th><th>Descrição</th></tr></thead>
    <tbody>
      <tr><td><code>BETTERAI_API_KEY</code></td><td>Chave interna usada no cabeçalho <code>X-API-Key</code></td></tr>
      <tr><td><code>OPENAI_API_KEY</code></td><td>Chave de API da OpenAI</td></tr>
      <tr><td><code>ANTHROPIC_API_KEY</code></td><td>Chave de API da Anthropic</td></tr>
      <tr><td><code>GEMINI_API_KEY</code></td><td>Chave de API do Google Gemini</td></tr>
      <tr><td><code>PINECONE_API_KEY</code></td><td>Chave de API do Pinecone</td></tr>
      <tr><td><code>NOSQL_BACKEND</code></td><td>Backend NoSQL: <code>local</code> ou remoto</td></tr>
      <tr><td><code>LOCAL</code></td><td>Execução local. Com <code>true</code>, a API não exige chave</td></tr>
    </tbody>
  </table>
  <details>
    <summary>Ver o modelo completo do .env</summary>
    <pre data-lang="env" data-title=".env"><code>
# BetterAI
BETTERAI_API_KEY=********************

# LLMs
OPENAI_API_KEY=********************
OPENAI_EMBEDDING_MODEL=text-embedding-3-large
GEMINI_API_KEY=********************
GROQ_API_KEY=********************
ANTHROPIC_API_KEY=********************

# Pinecone
PINECONE_API_KEY=********************
PINECONE_ENVIRONMENT=us-east-1
PINECONE_NAMESPACE=knowledge_base

# Regras de tracing
SHOW_INFO_LOGS=false
SAVE_LOGS=false
LOCAL=false
</code></pre>
  </details>
  <div class="callout" data-kind="warn"><p><strong>Só em desenvolvimento.</strong> <code>LOCAL=true</code> desliga a autenticação por chave em todas as rotas. Nunca use em homologação ou produção.</p></div>

  <h2>6. Execute a aplicação</h2>
  <p>O projeto tem dois serviços independentes. Rode cada um no seu terminal.</p>
  <table>
    <thead><tr><th>Serviço</th><th>Comando</th><th>Porta</th></tr></thead>
    <tbody>
      <tr><td>API (FastAPI)</td><td><code>uvicorn web_services:app --reload</code></td><td><code>8000</code></td></tr>
      <tr><td>Interface (Streamlit)</td><td><code>streamlit run web_app.py</code></td><td><code>8501</code></td></tr>
    </tbody>
  </table>
  <h3>API</h3>
  <pre data-lang="bash"><code>
uvicorn web_services:app --reload
</code></pre>
  <pre data-lang="output" data-title="Saída"><code>
INFO:     Uvicorn running on http://localhost:8000 (Press CTRL+C to quit)
INFO:     Router included: /agents
INFO:     Router included: /davinci
INFO:     Router included: /deep-research
INFO:     Router included: /parse-content
INFO:     Router included: /vector-store
INFO:     BetterAI Web Service Network initialized successfully.
INFO:     Application startup complete.
</code></pre>
  <p>Confirme que a API respondeu antes de seguir:</p>
  <pre data-lang="bash"><code>
curl -X GET "http://localhost:8000/health"
</code></pre>
  <div class="callout" data-kind="tip"><p>Se o <code>/health</code> respondeu, a documentação interativa está em <code>http://localhost:8000/docs</code>.</p></div>
  <h3>Interface Streamlit</h3>
  <pre data-lang="bash"><code>
streamlit run web_app.py
</code></pre>
  <p>A interface abre em <code>http://localhost:8501</code>, com o <a href="#/streamlit-applications/acquarello">Acquarello</a> e o <a href="#/streamlit-applications/content-generator">Content Generator</a>.</p>

  <h2>Resolução de problemas</h2>
  <table>
    <thead><tr><th>Sintoma</th><th>Causa provável</th><th>O que fazer</th></tr></thead>
    <tbody>
      <tr><td><code>ModuleNotFoundError</code> ao iniciar</td><td>Ambiente virtual desativado ou dependências ausentes</td><td>Reative o <code>.venv</code> e rode <code>uv sync</code></td></tr>
      <tr><td>Erro de autenticação nos provedores</td><td>Chave ausente ou inválida no <code>.env</code></td><td>Revise o passo 5</td></tr>
      <tr><td>Porta já em uso</td><td>Outra instância do serviço está ativa</td><td>Encerre o processo anterior ou use <code>--port</code></td></tr>
    </tbody>
  </table>

  <h2>Próximos passos</h2>
  <div class="cards">
    <a class="card" href="#/modules/agents/utils/model-gateway"><span class="card-icon" data-ico="boxes"></span><span class="card-title">Model Gateway</span><span class="card-text">Crie modelos e agentes de qualquer provedor pela mesma chamada.</span></a>
    <a class="card" href="#/modules/web-service-network/web-service-network-api"><span class="card-icon" data-ico="code"></span><span class="card-title">Web Service Network</span><span class="card-text">Autenticação, formato das respostas e endpoints da API.</span></a>
  </div>
</template>

<template data-page="modules/agents/utils/model-gateway" data-lang="pt"
  data-lead="Uma fábrica única para criar modelos e agentes Agno de qualquer provedor, com os parâmetros validados antes da chamada.">
  <p>A <code>ModelGateway</code> esconde as diferenças entre as APIs da Anthropic, do Google, da Groq e da OpenAI. Você informa o provedor e os parâmetros, e ela resolve a classe certa, confere os argumentos contra a assinatura real do construtor e devolve o modelo pronto.</p>
  <p>Ela cobre o seguinte:</p>
  <ul>
    <li><strong>Um ponto de entrada:</strong> o mesmo método cria modelos de qualquer provedor.</li>
    <li><strong>Apelidos de provedor:</strong> <code>anthropic</code> e <code>claude</code> levam ao mesmo lugar, assim como <code>google</code> e <code>gemini</code>.</li>
    <li><strong>Validação de parâmetros:</strong> argumentos que o modelo não aceita geram erro antes da chamada.</li>
    <li><strong>Agentes prontos:</strong> <code>create_agent</code> devolve um agente Agno já configurado.</li>
  </ul>
  <div class="callout" data-kind="info"><p>Todo código novo de agente deve criar modelos por aqui, em vez de importar os SDKs dos provedores diretamente.</p></div>

  <h2>Experimente</h2>
  <div class="tabs">
    <div data-tab="Anthropic">
      <pre data-lang="python"><code>
from src.agents.utils.model_gateway import ModelGateway

gateway = ModelGateway(strict_validation=True)

model = gateway.create_model(
    provider="anthropic",
    model_id="claude-sonnet-5-5",
    temperature=0.2,
)
</code></pre>
    </div>
    <div data-tab="Google">
      <pre data-lang="python"><code>
from src.agents.utils.model_gateway import ModelGateway

gateway = ModelGateway(strict_validation=True)

model = gateway.create_model(
    provider="google",
    model_id="gemini-2.5-flash",
    temperature=0.2,
)
</code></pre>
    </div>
    <div data-tab="OpenAI">
      <pre data-lang="python"><code>
from src.agents.utils.model_gateway import ModelGateway

gateway = ModelGateway(strict_validation=True)

# Um método por variante, sem informar o provider
model = gateway.openai_chat(model_id="gpt-4o-mini")
</code></pre>
    </div>
    <div data-tab="Groq">
      <pre data-lang="python"><code>
from src.agents.utils.model_gateway import ModelGateway

gateway = ModelGateway(strict_validation=True)

model = gateway.groq(model_id="llama-3.3-70b-versatile")
</code></pre>
    </div>
  </div>
  <div class="cards one">
    <a class="card row" href="#/getting-started/quickstart"><span class="card-icon" data-ico="bolt"></span><span><span class="card-title">Ainda não rodou o projeto?</span><span class="card-text" style="display:block">O Quickstart leva do clone ao primeiro request.</span></span></a>
  </div>

  <h2>Fluxo de execução</h2>
  <ol>
    <li>Instancie a <code>ModelGateway</code>, escolhendo se a validação é estrita.</li>
    <li>Chame <code>create_model</code> com o <code>provider</code> e, se quiser, o <code>model_id</code>.</li>
    <li>A classe normaliza o nome do provedor e resolve o construtor correspondente.</li>
    <li>Com validação estrita, cada parâmetro é conferido contra a assinatura do construtor.</li>
    <li>O modelo é criado e devolvido.</li>
  </ol>

  <h2>Métodos</h2>
  <table>
    <thead><tr><th>Método</th><th>Descrição</th></tr></thead>
    <tbody>
      <tr><td><code>supported_providers</code></td><td>Lista os provedores aceitos</td></tr>
      <tr><td><code>supported_parameters</code></td><td>Lista os parâmetros válidos para um modelo</td></tr>
      <tr><td><code>create_model</code></td><td>Cria uma instância do modelo escolhido</td></tr>
      <tr><td><code>create_agent</code></td><td>Cria um agente Agno já configurado com o modelo</td></tr>
      <tr><td><code>anthropic</code>, <code>google</code>, <code>groq</code></td><td>Atalhos por provedor</td></tr>
      <tr><td><code>openai_chat</code>, <code>openai_responses</code></td><td>Atalhos para as variantes da OpenAI</td></tr>
    </tbody>
  </table>

  <h2>Referência</h2>
  <h3>create_model</h3>
  <p>Cria e devolve uma instância do modelo do provedor informado.</p>
  <table>
    <thead><tr><th>Argumento</th><th>Tipo</th><th>Padrão</th><th>Descrição</th></tr></thead>
    <tbody>
      <tr><td><code>provider</code></td><td><code>str</code></td><td>obrigatório</td><td>Nome ou apelido do provedor, como <code>anthropic</code> ou <code>claude</code></td></tr>
      <tr><td><code>model_id</code></td><td><code>str | None</code></td><td><code>None</code></td><td>Identificador do modelo. Sem ele, vale o padrão do provedor</td></tr>
      <tr><td><code>openai_variant</code></td><td><code>str</code></td><td><code>"chat"</code></td><td>Variante da OpenAI: <code>chat</code>, <code>responses</code>, <code>open_responses</code> ou <code>like</code></td></tr>
      <tr><td><code>**kwargs</code></td><td><code>Any</code></td><td></td><td>Parâmetros repassados ao construtor do modelo</td></tr>
    </tbody>
  </table>
  <div class="callout" data-kind="danger"><p><strong>Levanta <code>ValueError</code></strong> quando o provedor não é reconhecido ou, com validação estrita, quando um parâmetro não existe no construtor do modelo.</p></div>

  <h3>create_agent</h3>
  <p>Chama <code>create_model</code> por dentro e devolve um <code>agno.agent.Agent</code> configurado. Aceita os mesmos argumentos de modelo, mais os do agente.</p>
  <pre data-lang="python"><code>
agent = gateway.create_agent(
    provider="google",
    model_id="gemini-2.5-flash",
    instructions="Responda em português e cite as fontes.",
    markdown=True,
)

agent.print_response("Resuma o catálogo de produtos.")
</code></pre>

  <h2>Variáveis de ambiente</h2>
  <p>O módulo chama <code>load_dotenv()</code> ao ser importado. A classe não lê variáveis diretamente, mas os modelos dependem das chaves de cada provedor:</p>
  <ul>
    <li><code>OPENAI_API_KEY</code> para os modelos da OpenAI</li>
    <li><code>ANTHROPIC_API_KEY</code> para os modelos da Anthropic</li>
    <li><code>GEMINI_API_KEY</code> para os modelos do Google</li>
  </ul>
</template>

<template data-page="modules/web-service-network/web-service-network-api" data-lang="pt"
  data-lead="A API FastAPI que expõe os serviços de IA. Autenticação, formato das respostas e os endpoints disponíveis.">
  <h2>Autenticação</h2>
  <p>Toda rota protegida exige o cabeçalho <code>X-API-Key</code> com o valor de <code>BETTERAI_API_KEY</code>.</p>
  <pre data-lang="bash"><code>
curl "http://localhost:8000/health-authorization" \
  -H "X-API-Key: $BETTERAI_API_KEY"
</code></pre>
  <div class="callout" data-kind="warn"><p>Com <code>LOCAL=true</code>, a verificação da chave é ignorada. Use só na sua máquina.</p></div>

  <h2>Formato das respostas</h2>
  <p>Toda resposta segue o mesmo envelope, seja qual for o serviço.</p>
  <pre data-lang="json"><code>
{
  "job_id": "b7f3c1e2-4a9d-4c1b-9f6e-2d8a5e0c7f41",
  "status": "completed",
  "result": {},
  "time": {
    "started_at": "2026-08-17T08:55:20Z",
    "duration_seconds": 3.42
  }
}
</code></pre>

  <h2>Endpoints</h2>
  <table>
    <thead><tr><th>Endpoint</th><th>Descrição</th></tr></thead>
    <tbody>
      <tr><td><code>GET /health</code></td><td>Verifica se o serviço está disponível</td></tr>
      <tr><td><code>POST /deep-research/context-builder</code></td><td>Monta contexto a partir de pesquisa web</td></tr>
      <tr><td><code>POST /parse-content/document-parse</code></td><td>Extrai dados estruturados de documentos</td></tr>
      <tr><td><code>POST /davinci/image-generation</code></td><td>Gera imagens</td></tr>
    </tbody>
  </table>

  <h3>Extrair dados de um documento</h3>
  <div class="endpoint"><span class="method" data-m="POST">POST</span><span>/parse-content/document-parse</span></div>
  <p>Converte arquivos <code>txt</code>, <code>md</code>, <code>pdf</code> e <code>docx</code> em dados estruturados, seguindo o schema que você envia.</p>
  <div class="tabs">
    <div data-tab="cURL">
      <pre data-lang="bash"><code>
curl -X POST "http://localhost:8000/parse-content/document-parse" \
  -H "X-API-Key: $BETTERAI_API_KEY" \
  -F "file=@contrato.pdf" \
  -F 'metadata={"fields":[{"name":"valor_total","type":"float"}]}'
</code></pre>
    </div>
    <div data-tab="Python">
      <pre data-lang="python"><code>
import requests

response = requests.post(
    "http://localhost:8000/parse-content/document-parse",
    headers={"X-API-Key": api_key},
    files={"file": open("contrato.pdf", "rb")},
    data={"metadata": '{"fields":[{"name":"valor_total","type":"float"}]}'},
)
print(response.json()["result"])
</code></pre>
    </div>
    <div data-tab="Resposta">
      <pre data-lang="json"><code>
{
  "job_id": "b7f3c1e2-4a9d-4c1b-9f6e-2d8a5e0c7f41",
  "status": "completed",
  "result": {
    "valor_total": 18450.0
  },
  "time": {
    "duration_seconds": 3.42
  }
}
</code></pre>
    </div>
  </div>

  <h3>Verificar disponibilidade</h3>
  <div class="endpoint"><span class="method" data-m="GET">GET</span><span>/health</span></div>
  <p>Não exige chave. Use para checagens de infraestrutura.</p>

  <h2>Streaming</h2>
  <p>As rotas de agentes respondem por SSE. Cada evento é uma linha <code>data:</code> com um JSON e um campo <code>event</code>.</p>
  <table>
    <thead><tr><th>Evento</th><th>Quando acontece</th></tr></thead>
    <tbody>
      <tr><td><code>StreamStart</code></td><td>A execução começou</td></tr>
      <tr><td><code>AgentChunk</code></td><td>Chegou um trecho de texto do agente</td></tr>
      <tr><td><code>ToolCallCompleted</code></td><td>Uma ferramenta terminou e devolveu metadados</td></tr>
      <tr><td><code>StreamEnd</code></td><td>A execução terminou</td></tr>
    </tbody>
  </table>
</template>

<template data-page="modules/agents/utils/model-gateway" data-lang="en"
  data-lead="A single factory to create Agno models and agents from any provider, with parameters validated before the call.">
  <p>The <code>ModelGateway</code> hides the differences between the Anthropic, Google, Groq and OpenAI APIs. You pass the provider and the parameters, and it resolves the right class, checks the arguments against the real constructor signature and returns the model ready to use.</p>
  <p>It covers the following:</p>
  <ul>
    <li><strong>One entry point:</strong> the same method creates models from any provider.</li>
    <li><strong>Provider aliases:</strong> <code>anthropic</code> and <code>claude</code> lead to the same place, as do <code>google</code> and <code>gemini</code>.</li>
    <li><strong>Parameter validation:</strong> arguments the model does not accept raise an error before the call.</li>
    <li><strong>Ready-made agents:</strong> <code>create_agent</code> returns an Agno agent already configured.</li>
  </ul>
  <div class="callout" data-kind="info"><p>All new agent code should create models through this class instead of importing provider SDKs directly.</p></div>

  <h2>Try it</h2>
  <div class="tabs">
    <div data-tab="Anthropic">
      <pre data-lang="python"><code>
from src.agents.utils.model_gateway import ModelGateway

gateway = ModelGateway(strict_validation=True)

model = gateway.create_model(
    provider="anthropic",
    model_id="claude-sonnet-5-5",
    temperature=0.2,
)
</code></pre>
    </div>
    <div data-tab="Google">
      <pre data-lang="python"><code>
from src.agents.utils.model_gateway import ModelGateway

gateway = ModelGateway(strict_validation=True)

model = gateway.create_model(
    provider="google",
    model_id="gemini-2.5-flash",
    temperature=0.2,
)
</code></pre>
    </div>
    <div data-tab="OpenAI">
      <pre data-lang="python"><code>
from src.agents.utils.model_gateway import ModelGateway

gateway = ModelGateway(strict_validation=True)

# One method per variant, no provider needed
model = gateway.openai_chat(model_id="gpt-4o-mini")
</code></pre>
    </div>
    <div data-tab="Groq">
      <pre data-lang="python"><code>
from src.agents.utils.model_gateway import ModelGateway

gateway = ModelGateway(strict_validation=True)

model = gateway.groq(model_id="llama-3.3-70b-versatile")
</code></pre>
    </div>
  </div>
  <div class="cards one">
    <a class="card row" href="#/getting-started/quickstart"><span class="card-icon" data-ico="bolt"></span><span><span class="card-title">Haven’t run the project yet?</span><span class="card-text" style="display:block">The Quickstart takes you from clone to first request.</span></span></a>
  </div>

  <h2>Execution flow</h2>
  <ol>
    <li>Instantiate <code>ModelGateway</code>, choosing whether validation is strict.</li>
    <li>Call <code>create_model</code> with the <code>provider</code> and, optionally, the <code>model_id</code>.</li>
    <li>The class normalizes the provider name and resolves the matching constructor.</li>
    <li>With strict validation, each parameter is checked against the constructor signature.</li>
    <li>The model is created and returned.</li>
  </ol>

  <h2>Methods</h2>
  <table>
    <thead><tr><th>Method</th><th>Description</th></tr></thead>
    <tbody>
      <tr><td><code>supported_providers</code></td><td>Lists the accepted providers</td></tr>
      <tr><td><code>supported_parameters</code></td><td>Lists the valid parameters for a model</td></tr>
      <tr><td><code>create_model</code></td><td>Creates an instance of the chosen model</td></tr>
      <tr><td><code>create_agent</code></td><td>Creates an Agno agent already configured with the model</td></tr>
      <tr><td><code>anthropic</code>, <code>google</code>, <code>groq</code></td><td>Per-provider shortcuts</td></tr>
      <tr><td><code>openai_chat</code>, <code>openai_responses</code></td><td>Shortcuts for the OpenAI variants</td></tr>
    </tbody>
  </table>

  <h2>Reference</h2>
  <h3>create_model</h3>
  <p>Creates and returns an instance of the model for the given provider.</p>
  <table>
    <thead><tr><th>Argument</th><th>Type</th><th>Default</th><th>Description</th></tr></thead>
    <tbody>
      <tr><td><code>provider</code></td><td><code>str</code></td><td>required</td><td>Provider name or alias, such as <code>anthropic</code> or <code>claude</code></td></tr>
      <tr><td><code>model_id</code></td><td><code>str | None</code></td><td><code>None</code></td><td>Model identifier. Without it, the provider default applies</td></tr>
      <tr><td><code>openai_variant</code></td><td><code>str</code></td><td><code>"chat"</code></td><td>OpenAI variant: <code>chat</code>, <code>responses</code>, <code>open_responses</code> or <code>like</code></td></tr>
      <tr><td><code>**kwargs</code></td><td><code>Any</code></td><td></td><td>Parameters passed to the model constructor</td></tr>
    </tbody>
  </table>
  <div class="callout" data-kind="danger"><p><strong>Raises <code>ValueError</code></strong> when the provider is not recognized or, with strict validation, when a parameter does not exist in the model constructor.</p></div>

  <h3>create_agent</h3>
  <p>Calls <code>create_model</code> internally and returns a configured <code>agno.agent.Agent</code>. It accepts the same model arguments, plus the agent’s own.</p>
  <pre data-lang="python"><code>
agent = gateway.create_agent(
    provider="google",
    model_id="gemini-2.5-flash",
    instructions="Answer in English and cite your sources.",
    markdown=True,
)

agent.print_response("Summarize the product catalog.")
</code></pre>

  <h2>Environment variables</h2>
  <p>The module calls <code>load_dotenv()</code> on import. The class does not read variables directly, but the models depend on each provider’s keys:</p>
  <ul>
    <li><code>OPENAI_API_KEY</code> for OpenAI models</li>
    <li><code>ANTHROPIC_API_KEY</code> for Anthropic models</li>
    <li><code>GEMINI_API_KEY</code> for Google models</li>
  </ul>
</template>

<template data-page="modules/agents/utils/model-gateway" data-lang="it"
  data-lead="Una factory unica per creare modelli e agenti Agno di qualsiasi provider, con i parametri validati prima della chiamata.">
  <p>La <code>ModelGateway</code> nasconde le differenze tra le API di Anthropic, Google, Groq e OpenAI. Indichi il provider e i parametri, e lei risolve la classe giusta, controlla gli argomenti rispetto alla firma reale del costruttore e restituisce il modello pronto.</p>
  <p>Copre quanto segue:</p>
  <ul>
    <li><strong>Un solo punto d’ingresso:</strong> lo stesso metodo crea modelli di qualsiasi provider.</li>
    <li><strong>Alias dei provider:</strong> <code>anthropic</code> e <code>claude</code> portano allo stesso posto, come <code>google</code> e <code>gemini</code>.</li>
    <li><strong>Validazione dei parametri:</strong> gli argomenti che il modello non accetta generano un errore prima della chiamata.</li>
    <li><strong>Agenti pronti:</strong> <code>create_agent</code> restituisce un agente Agno già configurato.</li>
  </ul>
  <div class="callout" data-kind="info"><p>Tutto il nuovo codice degli agenti deve creare i modelli da qui, invece di importare direttamente gli SDK dei provider.</p></div>

  <h2>Provalo</h2>
  <div class="tabs">
    <div data-tab="Anthropic">
      <pre data-lang="python"><code>
from src.agents.utils.model_gateway import ModelGateway

gateway = ModelGateway(strict_validation=True)

model = gateway.create_model(
    provider="anthropic",
    model_id="claude-sonnet-5-5",
    temperature=0.2,
)
</code></pre>
    </div>
    <div data-tab="Google">
      <pre data-lang="python"><code>
from src.agents.utils.model_gateway import ModelGateway

gateway = ModelGateway(strict_validation=True)

model = gateway.create_model(
    provider="google",
    model_id="gemini-2.5-flash",
    temperature=0.2,
)
</code></pre>
    </div>
    <div data-tab="OpenAI">
      <pre data-lang="python"><code>
from src.agents.utils.model_gateway import ModelGateway

gateway = ModelGateway(strict_validation=True)

# Un metodo per variante, senza indicare il provider
model = gateway.openai_chat(model_id="gpt-4o-mini")
</code></pre>
    </div>
    <div data-tab="Groq">
      <pre data-lang="python"><code>
from src.agents.utils.model_gateway import ModelGateway

gateway = ModelGateway(strict_validation=True)

model = gateway.groq(model_id="llama-3.3-70b-versatile")
</code></pre>
    </div>
  </div>
  <div class="cards one">
    <a class="card row" href="#/getting-started/quickstart"><span class="card-icon" data-ico="bolt"></span><span><span class="card-title">Non hai ancora avviato il progetto?</span><span class="card-text" style="display:block">Il Quickstart ti porta dal clone alla prima richiesta.</span></span></a>
  </div>

  <h2>Flusso di esecuzione</h2>
  <ol>
    <li>Istanzia la <code>ModelGateway</code>, scegliendo se la validazione è rigorosa.</li>
    <li>Chiama <code>create_model</code> con il <code>provider</code> e, se vuoi, il <code>model_id</code>.</li>
    <li>La classe normalizza il nome del provider e risolve il costruttore corrispondente.</li>
    <li>Con la validazione rigorosa, ogni parametro viene controllato rispetto alla firma del costruttore.</li>
    <li>Il modello viene creato e restituito.</li>
  </ol>

  <h2>Metodi</h2>
  <table>
    <thead><tr><th>Metodo</th><th>Descrizione</th></tr></thead>
    <tbody>
      <tr><td><code>supported_providers</code></td><td>Elenca i provider accettati</td></tr>
      <tr><td><code>supported_parameters</code></td><td>Elenca i parametri validi per un modello</td></tr>
      <tr><td><code>create_model</code></td><td>Crea un’istanza del modello scelto</td></tr>
      <tr><td><code>create_agent</code></td><td>Crea un agente Agno già configurato con il modello</td></tr>
      <tr><td><code>anthropic</code>, <code>google</code>, <code>groq</code></td><td>Scorciatoie per provider</td></tr>
      <tr><td><code>openai_chat</code>, <code>openai_responses</code></td><td>Scorciatoie per le varianti di OpenAI</td></tr>
    </tbody>
  </table>

  <h2>Riferimento</h2>
  <h3>create_model</h3>
  <p>Crea e restituisce un’istanza del modello del provider indicato.</p>
  <table>
    <thead><tr><th>Argomento</th><th>Tipo</th><th>Predefinito</th><th>Descrizione</th></tr></thead>
    <tbody>
      <tr><td><code>provider</code></td><td><code>str</code></td><td>obbligatorio</td><td>Nome o alias del provider, come <code>anthropic</code> o <code>claude</code></td></tr>
      <tr><td><code>model_id</code></td><td><code>str | None</code></td><td><code>None</code></td><td>Identificatore del modello. Senza di esso vale il predefinito del provider</td></tr>
      <tr><td><code>openai_variant</code></td><td><code>str</code></td><td><code>"chat"</code></td><td>Variante di OpenAI: <code>chat</code>, <code>responses</code>, <code>open_responses</code> o <code>like</code></td></tr>
      <tr><td><code>**kwargs</code></td><td><code>Any</code></td><td></td><td>Parametri passati al costruttore del modello</td></tr>
    </tbody>
  </table>
  <div class="callout" data-kind="danger"><p><strong>Solleva <code>ValueError</code></strong> quando il provider non è riconosciuto o, con la validazione rigorosa, quando un parametro non esiste nel costruttore del modello.</p></div>

  <h3>create_agent</h3>
  <p>Chiama <code>create_model</code> internamente e restituisce un <code>agno.agent.Agent</code> configurato. Accetta gli stessi argomenti del modello, più quelli dell’agente.</p>
  <pre data-lang="python"><code>
agent = gateway.create_agent(
    provider="google",
    model_id="gemini-2.5-flash",
    instructions="Rispondi in italiano e cita le fonti.",
    markdown=True,
)

agent.print_response("Riassumi il catalogo dei prodotti.")
</code></pre>

  <h2>Variabili d’ambiente</h2>
  <p>Il modulo chiama <code>load_dotenv()</code> all’importazione. La classe non legge direttamente le variabili, ma i modelli dipendono dalle chiavi di ogni provider:</p>
  <ul>
    <li><code>OPENAI_API_KEY</code> per i modelli di OpenAI</li>
    <li><code>ANTHROPIC_API_KEY</code> per i modelli di Anthropic</li>
    <li><code>GEMINI_API_KEY</code> per i modelli di Google</li>
  </ul>
</template>

    navArea = areaId;
    const switcher = `<div class="side-areas">${tabLinks().map(x => `<a href="${x.href}"${x.id === areaId ? ' aria-current="page"' : ''}>${esc(x.t)}</a>`).join('')}</div>`;
    let html;
    if (areaId === 'home') {
      html = `<a class="side-link" href="#/" data-id="home"><span>${esc(tr('overview'))}</span></a>` +
        group(tr('areas'), AREAS.map(a => `<li><a class="side-link" href="#/${a.id}"><span>${esc(a.t)}</span></a></li>`).join('')) +
        group(tr('popular'), POPULAR.map(id => `<li><a class="side-link" href="#/${id}"><span>${esc(BY_ID.get(id).t)}</span></a></li>`).join(''));
    } else {
      const a = AREAS.find(x => x.id === areaId);
      const loose = a.kids.filter(k => !k.kids), dirs = a.kids.filter(k => k.kids);
      html = `<a class="side-link" href="#/${a.id}" data-id="${a.id}"><span>${esc(tr('overview'))}</span></a>` +
        (loose.length ? group(looseOf(a), loose.map(pageLink).join('')) : '') +
        dirs.map(d => group(d.t, d.kids.map(nodeHtml).join(''))).join('');
    }
    nav.innerHTML = switcher + html;
    $('#side').scrollTop = 0;
  }
  nav.addEventListener('click', e => {
    const f = e.target.closest('.side-folder');
    if (!f) return;
    const open = f.getAttribute('aria-expanded') !== 'true';
    f.setAttribute('aria-expanded', open);
    f.nextElementSibling.hidden = !open;
  });
  function markActive(p, areaId) {
    $$('.tab', tabsEl).forEach(t => t.dataset.area === areaId ? t.setAttribute('aria-current', 'page') : t.removeAttribute('aria-current'));
    $$('.side-link', nav).forEach(a => a.removeAttribute('aria-current'));
    const link = $(`.side-link[data-id="${p.id}"]`, nav);
    if (!link) return;
    link.setAttribute('aria-current', 'page');
    for (let ul = link.closest('ul'); ul && nav.contains(ul); ul = ul.parentElement.closest('ul')) {
      const btn = ul.previousElementSibling;
      if (btn && btn.classList.contains('side-folder')) { ul.hidden = false; btn.setAttribute('aria-expanded', 'true'); }
    }
    const box = $('#side'), b = box.getBoundingClientRect(), r = link.getBoundingClientRect();
    if (r.top < b.top + 8 || r.bottom > b.bottom - 8) box.scrollTop += r.top - b.top - b.height / 3;
  }

  /* ---------- Realce de código ---------- */
  const STR = `"(?:\\\\.|[^"\\\\\\n])*"|'(?:\\\\.|[^'\\\\\\n])*'`;
  const RULES = {
    python: [new RegExp(`(#.*$)|(${STR})|\\b(def|class|return|import|from|as|if|else|elif|for|in|while|try|except|raise|with|and|or|not|lambda|await|async|pass)\\b|\\b(None|True|False|\\d+(?:\\.\\d+)?)\\b|([A-Za-z_]\\w*)(?=\\()`, 'gm'), ['c', 's', 'k', 'n', 'f']],
    bash: [new RegExp(`((?:^|(?<=\\s))#.*$)|(${STR})|((?<=\\s)--?[A-Za-z][\\w-]*)|(^[ \\t]*[A-Za-z.][\\w.\\\\/-]*)`, 'gm'), ['c', 's', 'n', 'f']],
    json: [new RegExp(`("(?:\\\\.|[^"\\\\])*")(?=\\s*:)|("(?:\\\\.|[^"\\\\])*")|\\b(true|false|null)\\b|(-?\\b\\d+(?:\\.\\d+)?\\b)`, 'g'), ['f', 's', 'k', 'n']],
    env: [/(#.*$)|(^[A-Z_]+)(?==)/gm, ['c', 'f']]
  };
  function highlight(src, lang) {
    const rule = RULES[lang];
    if (!rule) return esc(src);
    const [re, cls] = rule;
    re.lastIndex = 0;
    let out = '', last = 0, m;
    while ((m = re.exec(src))) {
      if (!m[0]) { re.lastIndex++; continue; }
      const gi = m.slice(1).findIndex(g => g !== undefined);
      out += esc(src.slice(last, m.index)) + `<span class="t-${cls[gi]}">${esc(m[0])}</span>`;
      last = m.index + m[0].length;
    }
    return out + esc(src.slice(last));
  }

  /* ---------- Corpos de página gerados ---------- */
  const card = (href, icon, title, text, row) => `<a class="card${row ? ' row' : ''}" href="${href}"><span class="card-icon">${ico(icon)}</span>${row ? '<span>' : ''}<span class="card-title">${esc(title)}</span><span class="card-text"${row ? ' style="display:block"' : ''}>${esc(text)}</span>${row ? '</span>' + ico('go', 'card-go') : ''}</a>`;
  const homeBody = () => tr('homeBody');
  const overviewBody = a => tr('overviewBody', a);
  const sampleBody = p => tr('sampleBody', p, p.t.replace(/[^A-Za-z0-9]+/g, ''));
  const emptyBody = (p, next) => tr('emptyBody', p, next);

  /* ---------- Renderização ---------- */
  const pageEl = $('#page'), tocEl = $('#toc');
  let headings = [], currentId = null;

  const tplFor = id => $(`template[data-page="${id}"][data-lang="${LANG}"]`) || $(`template[data-page="${id}"][data-lang="pt"]`);

  function render(p) {
    currentId = p.id;
    const areaId = p.home ? 'home' : p.area.id;
    document.title = p.home ? 'BetterAI Docs' : `${p.overview ? p.t : p.t + ' | ' + p.area.t} | BetterAI Docs`;
    const i = PAGES.indexOf(p), prev = PAGES[i - 1], next = PAGES[i + 1];
    const tpl = tplFor(p.id);
    const fallback = !!tpl && LANG !== 'pt' && tpl.dataset.lang === 'pt';

    let body = p.home ? homeBody() : p.overview ? overviewBody(p.area) : p.empty ? emptyBody(p, next) : tpl ? tpl.innerHTML : sampleBody(p);
    if (fallback) body = `<div class="callout" data-kind="note"><p>${esc(tr('untranslated'))}</p></div>` + body;
    const lead = p.home ? tr('homeLead') : p.overview ? aboutOf(p.area) : p.empty ? '' : tpl ? tpl.dataset.lead : tr('genericLead', p.t);
    const eyebrow = p.home || p.overview ? '' : (p.path.length ? p.path.join(' / ') : looseOf(p.area));
    const label = n => n.overview ? tr('overviewOf', n.t) : n.home ? tr('overview') : n.t;
    const title = p.home ? tr('homeTitle') : p.t;

    pageEl.innerHTML = `
      <header>
        ${eyebrow ? `<div class="eyebrow">${esc(eyebrow)}</div>` : ''}
        <div class="title-row">
          <h1 class="page-title" tabindex="-1">${esc(title)}</h1>
          <div class="copy-page">
            <button class="cp-main" type="button">${ico('copy')}<span>${esc(tr('copyPage'))}</span></button>
            <button class="cp-caret" type="button" aria-label="${esc(tr('moreOpts'))}" aria-expanded="false">${ico('down')}</button>
            <div class="cp-menu" hidden>
              <button type="button" data-fake>${esc(tr('copyMd'))}<small>${esc(tr('copyMdSub'))}</small></button>
              <button type="button" data-fake>${esc(tr('viewSrc'))}<small>${esc(p.src || 'doc/README.md')}</small></button>
            </div>
          </div>
        </div>
        ${lead ? `<p class="lead">${esc(lead)}</p>` : ''}
        <details class="toc-inline"><summary>${esc(tr('onThisPage'))}</summary><ul></ul></details>
      </header>
      <div class="prose">${body}</div>
      <div class="feedback">
        <span class="q">${esc(tr('helpful'))}</span>
        <button class="fb-btn" type="button">${ico('up')}${esc(tr('yes'))}</button>
        <button class="fb-btn" type="button">${ico('dn')}${esc(tr('no'))}</button>
        <a class="edit" href="#" data-fake>${ico('edit')}${esc(tr('edit'))}</a>
      </div>
      ${p.src ? `<p class="source">${esc(tr('source'))} <code>${esc(p.src)}</code></p>` : ''}
      <nav class="pager" aria-label="${esc(tr('pagerLbl'))}">
        ${prev ? `<a class="pager-link prev" href="#/${prev.home ? '' : prev.id}">${ico('chevron')}<div><small>${esc(tr('prev'))}</small><span>${esc(label(prev))}</span></div></a>` : ''}
        ${next ? `<a class="pager-link next" href="#/${next.id}"><div><small>${esc(tr('next'))}</small><span>${esc(label(next))}</span></div>${ico('chevron')}</a>` : ''}
      </nav>`;
    enhance($('.prose', pageEl));
    renderNav(areaId);
    markActive(p, areaId);
    buildToc(p);
    $('#crumbArea').textContent = p.home ? 'BetterAI' : p.area.t;
    $('#crumbPage').textContent = p.home || p.overview ? tr('overview') : p.t;
  }

  function copyButton(getText, cls = '') {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'copy ' + cls; b.setAttribute('aria-label', tr('copyCode')); b.innerHTML = ico('copy');
    b.addEventListener('click', async () => {
      try { await navigator.clipboard.writeText(getText()); } catch (e) {}
      b.innerHTML = ico('check');
      setTimeout(() => { b.innerHTML = ico('copy'); }, 1600);
    });
    return b;
  }
  function prep(pre) {
    const code = $('code', pre);
    pre.raw = code.textContent.replace(/^\n/, '').replace(/\s+$/, '');
    code.innerHTML = highlight(pre.raw, pre.dataset.lang || '');
  }

  function enhance(prose) {
    $$('[data-ico]', prose).forEach(s => { s.innerHTML = ico(s.dataset.ico); });
    $$('.card.row', prose).forEach(c => { if (!$('.card-go', c)) c.insertAdjacentHTML('beforeend', ico('go', 'card-go')); });
    $$('table', prose).forEach(t => { const w = document.createElement('div'); w.className = 'table-wrap'; t.replaceWith(w); w.append(t); });

    // grupos de código com abas
    $$('.tabs', prose).forEach(tabs => {
      const panels = $$(':scope > [data-tab]', tabs);
      const box = document.createElement('div'); box.className = 'code';
      const head = document.createElement('div'); head.className = 'code-head';
      const list = document.createElement('div'); list.className = 'code-tabs'; list.setAttribute('role', 'tablist');
      const body = document.createElement('div'); body.className = 'code-body';
      let active = null;
      panels.forEach((panel, i) => {
        const pre = $('pre', panel); prep(pre); pre.hidden = i > 0;
        if (i === 0) active = pre;
        const b = document.createElement('button');
        b.type = 'button'; b.className = 'code-tab'; b.textContent = panel.dataset.tab;
        b.setAttribute('role', 'tab'); b.setAttribute('aria-selected', i === 0);
        b.addEventListener('click', () => {
          $$('.code-tab', list).forEach(x => x.setAttribute('aria-selected', x === b));
          $$('pre', body).forEach(x => { x.hidden = x !== pre; });
          active = pre;
        });
        list.append(b); body.append(pre);
      });
      head.append(list, copyButton(() => active.raw));
      box.append(head, body);
      tabs.replaceWith(box);
    });
    // blocos de código soltos
    $$('pre', prose).forEach(pre => {
      if (pre.closest('.code')) return;
      prep(pre);
      const box = document.createElement('div');
      const body = document.createElement('div'); body.className = 'code-body';
      const title = pre.dataset.title;
      pre.replaceWith(box);
      if (title) {
        box.className = 'code';
        const head = document.createElement('div'); head.className = 'code-head';
        head.innerHTML = `<span class="code-title">${esc(title)}</span>`;
        head.append(copyButton(() => pre.raw));
        body.append(pre); box.append(head, body);
      } else {
        box.className = 'code plain';
        body.append(pre, copyButton(() => pre.raw, 'floating')); box.append(body);
      }
    });
    $$('.callout', prose).forEach(c => c.insertAdjacentHTML('afterbegin', ico(ICON[c.dataset.kind] ? c.dataset.kind : 'info')));
    $$('.frame video', prose).forEach(v => v.addEventListener('error', () => { v.hidden = true; v.nextElementSibling.hidden = false; }));
    const seen = new Set();
    $$('h2, h3', prose).forEach(h => {
      let id = slug(h.textContent), n = 2;
      while (seen.has(id)) id = slug(h.textContent) + '-' + n++;
      seen.add(id);
      h.id = id;
      h.insertAdjacentHTML('afterbegin', `<a class="anchor" href="#/${currentId}::${id}" aria-label="${esc(tr('anchorLbl'))}">#</a>`);
    });
  }

  function buildToc(p) {
    headings = $$('.prose h2, .prose h3', pageEl);
    const has = headings.length > 1;
    document.body.classList.toggle('no-toc', !has);
    const items = headings.map(h => `<li><a class="lvl-${h.tagName[1]}" href="#/${p.id}::${h.id}" data-h="${h.id}">${esc(h.textContent.replace(/^#/, ''))}</a></li>`).join('');
    tocEl.innerHTML = has ? `<p class="toc-title">${ico('list')}${esc(tr('onThisPage'))}</p><ul>${items}</ul>` : '';
    const inline = $('.toc-inline', pageEl);
    if (has) $('ul', inline).innerHTML = items; else inline.remove();
    spy();
  }

  /* ---------- Rolagem: seção ativa ---------- */
  const header = $('#header');
  const top = () => header.offsetHeight;
  function spy() {
    if (!headings.length) return;
    let active = headings[0];
    for (const h of headings) { if (h.getBoundingClientRect().top <= top() + 40) active = h; else break; }
    if (innerHeight + scrollY >= document.documentElement.scrollHeight - 4) active = headings[headings.length - 1];
    $$('a', tocEl).forEach(a => a.dataset.h === active.id ? a.setAttribute('aria-current', 'true') : a.removeAttribute('aria-current'));
  }
  let ticking = false;
  addEventListener('scroll', () => { if (!ticking) { ticking = true; requestAnimationFrame(() => { ticking = false; spy(); }); } }, { passive: true });
  const syncTop = () => document.documentElement.style.setProperty('--top', top() + 'px');
  new ResizeObserver(syncTop).observe(header);
  syncTop();
  $('#banner button').addEventListener('click', () => { $('#banner').hidden = true; });

  /* ---------- Rotas ---------- */
  function route() {
    const [rawId, anchor] = decodeURIComponent(location.hash.replace(/^#\/?/, '')).split('::');
    const p = BY_ID.get(rawId || 'home') || HOME;
    const samePage = p.id === currentId;
    if (!samePage) render(p);
    closeNav();
    const target = anchor && document.getElementById(anchor);
    if (target) target.scrollIntoView();
    else if (!samePage) {
      scrollTo(0, 0);
      const h1 = $('.page-title', pageEl);
      if (h1) h1.focus({ preventScroll: true });
    }
    spy();
  }
  addEventListener('hashchange', route);
  document.addEventListener('click', e => {
    if (e.target.closest('[data-fake]')) e.preventDefault();
    if (e.target.closest('[data-open-search]')) openSearch();
    const inline = e.target.closest('.toc-inline a');
    if (inline) inline.closest('details').open = false;

    const caret = e.target.closest('.cp-caret'), menu = $('.cp-menu', pageEl);
    if (caret) { menu.hidden = !menu.hidden; caret.setAttribute('aria-expanded', !menu.hidden); }
    else if (menu && !menu.hidden) { menu.hidden = true; $('.cp-caret', pageEl).setAttribute('aria-expanded', 'false'); }
    const cp = e.target.closest('.cp-main');
    if (cp) {
      try { navigator.clipboard.writeText($('.page-title', pageEl).textContent + '\n\n' + $('.prose', pageEl).innerText); } catch (err) {}
      cp.innerHTML = ico('check') + `<span>${esc(tr('copied'))}</span>`;
      setTimeout(() => { cp.innerHTML = ico('copy') + `<span>${esc(tr('copyPage'))}</span>`; }, 1600);
    }
    const fb = e.target.closest('.fb-btn');
    if (fb) { const box = fb.closest('.feedback'); $$('.fb-btn', box).forEach(b => b.remove()); $('.q', box).textContent = tr('thanks'); }
  });

  /* ---------- Menu no celular ---------- */
  const menuBtn = $('#menuBtn');
  function closeNav() { document.body.classList.remove('nav-open'); menuBtn.setAttribute('aria-expanded', 'false'); }
  menuBtn.addEventListener('click', () => {
    const open = document.body.classList.toggle('nav-open');
    menuBtn.setAttribute('aria-expanded', open);
  });
  $('#scrim').addEventListener('click', closeNav);

  /* ---------- Tema ---------- */
  const themeBtn = $('#themeBtn');
  function paintTheme() { themeBtn.innerHTML = ico(document.documentElement.dataset.theme === 'dark' ? 'sun' : 'moon'); }
  themeBtn.addEventListener('click', () => {
    const t = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
    document.documentElement.dataset.theme = t;
    try { localStorage.setItem('betterai-docs-theme', t); } catch (e) {}
    paintTheme();
  });
  paintTheme();

  /* ---------- Busca ---------- */
  const dialog = $('#search'), q = $('#q'), results = $('#results');
  let INDEX = [];
  function buildIndex() {
    INDEX = [];
    for (const p of PAGES) {
      if (p.home) continue;
      const where = p.overview ? tr('areaOverview') : [p.area.t, ...p.path].join(' / ');
      INDEX.push({ href: `#/${p.id}`, title: p.t, path: where, page: true });
      const tpl = tplFor(p.id);
      if (tpl) $$('h2, h3', tpl.content).forEach(h => INDEX.push({ href: `#/${p.id}::${slug(h.textContent)}`, title: h.textContent, path: [p.area.t, ...p.path, p.t].join(' / ') }));
    }
  }
  const fold = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
  function mark(text, term) {
    const i = term ? fold(text).indexOf(term) : -1;
    return i < 0 ? esc(text) : esc(text.slice(0, i)) + '<mark>' + esc(text.slice(i, i + term.length)) + '</mark>' + esc(text.slice(i + term.length));
  }
  let sel = 0;
  function search() {
    const term = fold(q.value.trim());
    let list, label = '';
    if (!term) {
      label = tr('suggestions');
      list = POPULAR.map(id => INDEX.find(x => x.href === `#/${id}`));
    } else {
      list = INDEX.map(x => {
        const t = fold(x.title), pth = fold(x.path);
        const score = t.startsWith(term) ? 0 : t.includes(term) ? 1 : pth.includes(term) ? 2 : -1;
        return { x, score: score < 0 ? -1 : score + (x.page ? 0 : .5) };
      }).filter(r => r.score >= 0).sort((a, b) => a.score - b.score).slice(0, 9).map(r => r.x);
    }
    sel = 0;
    results.innerHTML = list.length
      ? (label ? `<li class="results-label" role="presentation">${label}</li>` : '') +
        list.map((x, i) => `<li class="result" role="option" aria-selected="${i === 0}"><a href="${x.href}" tabindex="-1"><span class="r-title">${mark(x.title, term)}</span><span class="r-path">${mark(x.path, term)}</span></a></li>`).join('')
      : `<li class="no-results" role="presentation">${esc(tr('noResults', q.value.trim()))}</li>`;
  }
  function move(d) {
    const items = $$('.result', results);
    if (!items.length) return;
    sel = (sel + d + items.length) % items.length;
    items.forEach((li, i) => li.setAttribute('aria-selected', i === sel));
    items[sel].scrollIntoView({ block: 'nearest' });
  }
  function openSearch() { if (dialog.open) return; closeNav(); q.value = ''; search(); dialog.showModal(); q.focus(); }
  q.addEventListener('input', search);
  q.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown') { e.preventDefault(); move(1); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); move(-1); }
    else if (e.key === 'Enter') { e.preventDefault(); const a = $('.result[aria-selected="true"] a', results); if (a) { dialog.close(); location.hash = a.getAttribute('href'); } }
  });
  results.addEventListener('click', e => { if (e.target.closest('a')) dialog.close(); });
  dialog.addEventListener('click', e => { if (e.target === dialog) dialog.close(); });
  addEventListener('keydown', e => {
    const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
    if ((e.key.toLowerCase() === 'k' && (e.ctrlKey || e.metaKey)) || (e.key === '/' && !typing)) { e.preventDefault(); openSearch(); }
    if (e.key === 'Escape') closeNav();
  });

  /* ---------- Idioma ---------- */
  const langBtn = $('#langBtn'), langMenu = $('#langMenu');
  function applyStatic() {
    document.documentElement.lang = { pt: 'pt-BR', en: 'en', it: 'it' }[LANG];
    $$('[data-i]').forEach(el => { el.textContent = tr(el.dataset.i); });
    $$('[data-ia]').forEach(el => el.setAttribute('aria-label', tr(el.dataset.ia)));
    $$('[data-ip]').forEach(el => el.setAttribute('placeholder', tr(el.dataset.ip)));
  }
  function paintLang() {
    $('b', langBtn).textContent = LANG.toUpperCase();
    langMenu.innerHTML = LANGS.map(l => `<li role="none"><button type="button" role="menuitemradio" data-lang="${l.id}" aria-checked="${l.id === LANG}"><span>${l.name}</span>${ico('check', 'ck')}</button></li>`).join('');
  }
  function closeLang() { langMenu.hidden = true; langBtn.setAttribute('aria-expanded', 'false'); }
  function setLang(id) {
    if (id === LANG) return;
    LANG = id;
    try { localStorage.setItem('betterai-docs-lang', id); } catch (e) {}
    const y = scrollY;
    applyStatic(); renderTabs(); buildIndex(); paintLang();
    navArea = null; currentId = null;
    route();
    scrollTo(0, y);
  }
  langBtn.addEventListener('click', () => {
    const open = langMenu.hidden;
    langMenu.hidden = !open;
    langBtn.setAttribute('aria-expanded', open);
  });
  langMenu.addEventListener('click', e => {
    const b = e.target.closest('[data-lang]');
    if (b) { setLang(b.dataset.lang); closeLang(); langBtn.focus(); }
  });
  document.addEventListener('click', e => { if (!e.target.closest('.lang')) closeLang(); });
  addEventListener('keydown', e => { if (e.key === 'Escape') closeLang(); });

  applyStatic(); renderTabs(); buildIndex(); paintLang();
  route();
})();
</script>
</body>
</html>
