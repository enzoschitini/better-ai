[pytest]
# Roda a partir da raiz do repo ou de supabase/:  python -m pytest supabase/tests
pythonpath = .
testpaths = tests
addopts = -ra
markers =
    unit: testes offline com fakes (padrao)
    contract: bateria de contrato (fake e adapter)
    integration: exige projeto Supabase de teste (SBX_TEST_*)
    e2e: fluxos completos pela fachada contra projeto de teste
    slow: testes demorados (ex.: arquivo grande)
