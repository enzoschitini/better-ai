<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BetterAI Docs</title>
<script>
  // Define o tema antes de pintar a página, para não piscar
  (function () {
    var t = null;
    try { t = localStorage.getItem('betterai-docs-theme'); } catch (e) {}
    if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.dataset.theme = t;
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ---------- Tokens ---------- */
:root {
  --font-display: "Bricolage Grotesque", "Instrument Sans", system-ui, sans-serif;
  --font-body: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "Cascadia Code", Consolas, monospace;

  --header-h: 60px;
  --sidebar-w: 296px;
  --toc-w: 240px;

  /* cores da marca, tiradas do coala */
  --cyan: #3fc1f5;
  --indigo: #4b61d1;
  --orchid: #c57be8;
  --coral: #ff7b72;

  --bg: #ffffff;
  --bg-soft: #f4f5fb;
  --bg-sunken: #eef0f8;
  --ink: #161a2e;
  --ink-2: #434a66;
  --ink-3: #666d8f;
  --line: #e2e5f0;
  --brand: #4257c9;
  --brand-soft: #eceffd;

  --code-bg: #f6f7fc;
  --t-c: #7c84a6;
  --t-s: #0b7a6f;
  --t-k: #4257c9;
  --t-n: #a8358a;
  --t-f: #1d5fa8;

  --info-bg: #eef2ff;   --info-ink: #3447b3;
  --warn-bg: #fff5e6;   --warn-ink: #96560a;
  --ok-bg: #e9f8f1;     --ok-ink: #17694a;
  --danger-bg: #ffeeed; --danger-ink: #b3322a;

  --shadow-pop: 0 24px 60px -20px rgba(22, 26, 46, .35), 0 2px 8px rgba(22, 26, 46, .08);
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bg: #0f1222;
  --bg-soft: #171b32;
  --bg-sunken: #1c2140;
  --ink: #e9ebf7;
  --ink-2: #b9bed9;
  --ink-3: #8c93b6;
  --line: #272c4a;
  --brand: #98a7ff;
  --brand-soft: #1e2550;

  --code-bg: #141830;
  --t-c: #7a82a8;
  --t-s: #6fd6c4;
  --t-k: #98a7ff;
  --t-n: #e59bd3;
  --t-f: #7cc4ff;

  --info-bg: #1a2149;   --info-ink: #aab6ff;
  --warn-bg: #33260f;   --warn-ink: #f1c27a;
  --ok-bg: #12301f;     --ok-ink: #7fdcae;
  --danger-bg: #391a1c; --danger-ink: #ff9e97;

  --shadow-pop: 0 24px 60px -20px rgba(0, 0, 0, .7), 0 2px 8px rgba(0, 0, 0, .4);
  color-scheme: dark;
}

/* ---------- Base ---------- */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-padding-top: calc(var(--header-h) + 24px); }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 400 1.0625rem/1.65 var(--font-body);
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
a { color: var(--brand); }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; border-radius: 6px; }
[hidden] { display: none !important; }
svg.ico { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
kbd {
  font: 500 .75rem/1 var(--font-mono);
  padding: 4px 6px; border-radius: 6px;
  border: 1px solid var(--line); background: var(--bg); color: var(--ink-3);
}
.skip { position: absolute; left: 12px; top: -60px; z-index: 100; background: var(--ink); color: var(--bg); padding: 10px 14px; border-radius: 8px; }
.skip:focus { top: 10px; }

/* ---------- Barra superior ---------- */
.topbar {
  position: sticky; top: 0; z-index: 50;
  height: var(--header-h);
  background: color-mix(in srgb, var(--bg) 86%, transparent);
  backdrop-filter: saturate(1.4) blur(12px);
  border-bottom: 1px solid var(--line);
}
.topbar-inner {
  max-width: 1480px; height: 100%; margin: 0 auto; padding: 0 20px;
  display: flex; align-items: center; gap: 14px;
}
.menu-btn { display: none; width: 38px; height: 38px; border-radius: 10px; align-items: center; justify-content: center; }
.menu-btn:hover, .icon-btn:hover { background: var(--bg-soft); }
.brand {
  flex: none; width: calc(var(--sidebar-w) - 20px);
  display: flex; align-items: center; gap: 10px;
  color: var(--ink); text-decoration: none;
}
.brand img { width: 30px; height: 31px; object-fit: contain; }
.brand-mark { width: 28px; height: 28px; border-radius: 9px; background: linear-gradient(150deg, var(--cyan), var(--indigo) 45%, var(--orchid) 75%, var(--coral)); }
.brand-name { font: 700 1.1875rem/1 var(--font-display); letter-spacing: -.01em; }
.brand-sub { font-size: .875rem; color: var(--ink-3); padding-left: 10px; border-left: 1px solid var(--line); }
.search-trigger {
  flex: 0 1 440px; min-width: 0;
  display: flex; align-items: center; gap: 10px;
  height: 38px; padding: 0 10px 0 12px;
  border: 1px solid var(--line); border-radius: 10px;
  background: var(--bg-soft); color: var(--ink-3); font-size: .9375rem; text-align: left;
}
.search-trigger:hover { border-color: var(--ink-3); color: var(--ink-2); }
.search-trigger span { flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.top-actions { margin-left: auto; display: flex; align-items: center; gap: 4px; }
.top-link { font-size: .9375rem; font-weight: 500; color: var(--ink-2); text-decoration: none; padding: 8px 10px; border-radius: 8px; white-space: nowrap; }
.top-link:hover { color: var(--ink); background: var(--bg-soft); }
.icon-btn { width: 38px; height: 38px; border-radius: 10px; display: inline-flex; align-items: center; justify-content: center; color: var(--ink-2); }
.proto-tag { font-size: .75rem; font-weight: 600; color: var(--warn-ink); background: var(--warn-bg); padding: 4px 9px; border-radius: 999px; margin-right: 6px; white-space: nowrap; }

.progress { position: fixed; top: var(--header-h); left: 0; right: 0; height: 2px; z-index: 49; pointer-events: none; }
.progress span {
  display: block; height: 100%; transform-origin: 0 50%; transform: scaleX(var(--p, 0));
  background: linear-gradient(90deg, var(--cyan), var(--indigo) 40%, var(--orchid) 72%, var(--coral));
}
.is-home .progress { display: none; }

/* ---------- Estrutura ---------- */
.shell {
  max-width: 1480px; margin: 0 auto;
  display: grid; grid-template-columns: var(--sidebar-w) minmax(0, 1fr) var(--toc-w);
}
.is-home .shell, .no-toc .shell { grid-template-columns: var(--sidebar-w) minmax(0, 1fr); }
.is-home .toc, .no-toc .toc { display: none; }

/* ---------- Navegação lateral ---------- */
.sidebar {
  position: sticky; top: var(--header-h);
  height: calc(100vh - var(--header-h));
  display: flex; flex-direction: column;
  border-right: 1px solid var(--line);
  background: var(--bg);
}
.nav { flex: 1; overflow-y: auto; padding: 20px 12px 28px 14px; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
.nav ul { list-style: none; margin: 0; padding: 0; }
.nav ul ul { margin: 2px 0 4px 16px; padding-left: 6px; border-left: 1px solid var(--line); }
.nav-group { margin-top: 24px; }
.nav-title { font: 600 .9375rem/1.3 var(--font-display); color: var(--ink); margin: 0 0 6px; padding: 0 10px; }
.nav-link, .nav-folder {
  display: flex; align-items: center; gap: 8px; width: 100%;
  padding: 6px 10px; border-radius: 8px;
  font-size: .9063rem; line-height: 1.35; text-align: left;
  color: var(--ink-2); text-decoration: none;
}
.nav-link:hover, .nav-folder:hover { background: var(--bg-soft); color: var(--ink); }
.nav-link[aria-current="page"] { background: var(--brand-soft); color: var(--brand); font-weight: 600; }
.nav-folder svg { margin-left: auto; width: 15px; height: 15px; color: var(--ink-3); transition: transform .16s ease; }
.nav-folder[aria-expanded="true"] svg { transform: rotate(90deg); }
.nav-link.is-empty { color: var(--ink-3); }
.nav-tag { margin-left: auto; font-size: .6875rem; font-weight: 500; color: var(--ink-3); border: 1px dashed var(--line); padding: 1px 6px; border-radius: 999px; white-space: nowrap; }
.sidebar-foot { flex: none; padding: 12px 24px; border-top: 1px solid var(--line); font-size: .8125rem; color: var(--ink-3); display: flex; justify-content: space-between; }
.scrim { display: none; }

/* ---------- Conteúdo ---------- */
.content { min-width: 0; padding: 40px 48px 96px; }
.article { max-width: 44rem; margin: 0 auto; }
.is-home .article { max-width: 58rem; }
.crumbs { display: flex; flex-wrap: wrap; gap: 6px; font-size: .875rem; color: var(--ink-3); margin-bottom: 14px; }
.crumbs span + span::before { content: "/"; margin-right: 6px; color: var(--line); }
.page-title { font: 700 2.5rem/1.1 var(--font-display); letter-spacing: -.022em; margin: 0 0 14px; text-wrap: balance; }
.page-title:focus { outline: none; }
.lead { font-size: 1.1875rem; line-height: 1.55; color: var(--ink-2); margin: 0 0 18px; text-wrap: pretty; }
.page-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 14px; font-size: .875rem; color: var(--ink-3); padding-bottom: 26px; margin-bottom: 30px; border-bottom: 1px solid var(--line); }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px 3px 8px; border-radius: 999px; background: var(--bg-soft); color: var(--ink-2); font-weight: 500; }
.chip svg { width: 15px; height: 15px; }

.prose > :first-child { margin-top: 0; }
.prose h2 { font: 650 1.5625rem/1.22 var(--font-display); letter-spacing: -.012em; margin: 2.5em 0 .65em; }
.prose h3 { font: 650 1.1875rem/1.3 var(--font-display); margin: 2em 0 .5em; }
.prose h2, .prose h3 { position: relative; }
.anchor { position: absolute; left: -1.15em; top: 0; width: 1.15em; color: var(--ink-3); text-decoration: none; opacity: 0; font-weight: 500; }
.prose h2:hover .anchor, .prose h3:hover .anchor, .anchor:focus-visible { opacity: 1; }
.prose p { margin: 0 0 1.1em; text-wrap: pretty; }
.prose ul, .prose ol { margin: 0 0 1.2em; padding-left: 1.4em; }
.prose li { margin-bottom: .4em; }
.prose li::marker { color: var(--ink-3); }
.prose a { text-underline-offset: 3px; text-decoration-thickness: 1px; }
.prose a:hover { text-decoration-thickness: 2px; }
.prose :not(pre) > code {
  font: 500 .86em var(--font-mono);
  background: var(--bg-sunken); padding: .12em .4em; border-radius: 6px;
  overflow-wrap: break-word;
}
.prose td:first-child code { white-space: nowrap; }
.prose hr { border: 0; border-top: 1px solid var(--line); margin: 2.4em 0; }
.prose img, .prose video { display: block; max-width: 100%; border-radius: 12px; }
.prose figure { margin: 1.6em 0; }
.prose figcaption { font-size: .875rem; color: var(--ink-3); margin-top: 10px; }

.table-wrap { margin: 1.4em 0; border: 1px solid var(--line); border-radius: 12px; overflow-x: auto; }
.table-wrap table { width: 100%; border-collapse: collapse; font-size: .9375rem; line-height: 1.5; }
.table-wrap th { text-align: left; font-weight: 600; background: var(--bg-soft); white-space: nowrap; }
.table-wrap th, .table-wrap td { padding: 10px 14px; border-bottom: 1px solid var(--line); vertical-align: top; }
.table-wrap tr:last-child td { border-bottom: 0; }

.code { margin: 1.4em 0; border: 1px solid var(--line); border-radius: 12px; background: var(--code-bg); overflow: hidden; }
.code-bar { display: flex; align-items: center; justify-content: space-between; padding: 6px 8px 6px 14px; border-bottom: 1px solid var(--line); font-size: .8125rem; color: var(--ink-3); }
.code-lang { font-weight: 500; }
.copy { display: inline-flex; align-items: center; gap: 6px; padding: 4px 9px; border-radius: 7px; font-size: .8125rem; font-weight: 500; color: var(--ink-2); }
.copy:hover { background: var(--bg-sunken); color: var(--ink); }
.copy svg { width: 15px; height: 15px; }
.code pre { margin: 0; padding: 14px 16px; overflow-x: auto; font: 400 .875rem/1.65 var(--font-mono); tab-size: 4; }
.code code { font: inherit; }
.t-c { color: var(--t-c); font-style: italic; }
.t-s { color: var(--t-s); }
.t-k { color: var(--t-k); font-weight: 500; }
.t-n { color: var(--t-n); }
.t-f { color: var(--t-f); }

.tabs { margin: 1.4em 0; }
.tab-list { display: flex; gap: 2px; box-shadow: inset 0 -1px 0 var(--line); overflow-x: auto; overflow-y: hidden; scrollbar-width: none; }
.tab-btn { padding: 8px 14px; font-size: .9375rem; font-weight: 500; color: var(--ink-3); border-bottom: 2px solid transparent; white-space: nowrap; }
.tab-btn:hover { color: var(--ink); }
.tab-btn[aria-selected="true"] { color: var(--brand); border-bottom-color: var(--brand); }
.tabs .code { margin-top: 12px; }
.tab-panel > :last-child { margin-bottom: 0; }

.callout { display: flex; gap: 12px; margin: 1.4em 0; padding: 14px 16px; border-radius: 12px; background: var(--info-bg); color: var(--info-ink); }
.callout svg { margin-top: 4px; }
.callout p { margin: 0; color: var(--ink); }
.callout[data-kind="warn"] { background: var(--warn-bg); color: var(--warn-ink); }
.callout[data-kind="ok"] { background: var(--ok-bg); color: var(--ok-ink); }
.callout[data-kind="danger"] { background: var(--danger-bg); color: var(--danger-ink); }

.endpoint { display: flex; align-items: center; gap: 12px; margin: 1.4em 0 1em; padding: 10px 14px; border: 1px solid var(--line); border-radius: 12px; font: 500 .9375rem var(--font-mono); overflow-x: auto; }
.method { flex: none; font-size: .75rem; font-weight: 600; padding: 3px 8px; border-radius: 6px; background: var(--info-bg); color: var(--info-ink); }
.method[data-m="GET"] { background: var(--ok-bg); color: var(--ok-ink); }

.prose details { margin: 1.4em 0; border: 1px solid var(--line); border-radius: 12px; padding: 0 16px; }
.prose summary { cursor: pointer; padding: 12px 0; font-weight: 600; }
.prose details[open] summary { border-bottom: 1px solid var(--line); margin-bottom: 4px; }
.prose details .code { border: 0; background: none; margin: 0 -16px; border-radius: 0; }

.video-frame { margin: 1.6em 0; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; background: var(--bg-sunken); }
.video-frame video { width: 100%; border-radius: 0; aspect-ratio: 16 / 9; background: #0c0e1c; }
.video-missing { aspect-ratio: 16 / 9; display: grid; place-content: center; gap: 6px; text-align: center; padding: 24px; color: var(--ink-3); font-size: .9375rem; }

/* TOC embutido (telas médias e pequenas) */
.toc-inline { display: none; margin: -8px 0 28px; border: 1px solid var(--line); border-radius: 12px; padding: 0 16px; font-size: .9375rem; }
.toc-inline summary { cursor: pointer; padding: 11px 0; font-weight: 600; }
.toc-inline ul { list-style: none; margin: 0; padding: 0 0 12px; }
.toc-inline a { display: block; padding: 5px 0; color: var(--ink-2); text-decoration: none; }
.toc-inline .lvl-3 { padding-left: 14px; }

/* ---------- Rodapé da página ---------- */
.page-foot { margin-top: 64px; }
.pager { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.pager-link { display: flex; flex-direction: column; gap: 4px; padding: 14px 18px; border: 1px solid var(--line); border-radius: 14px; text-decoration: none; color: var(--ink); min-width: 0; }
.pager-link:hover { border-color: var(--brand); }
.pager-link small { font-size: .8125rem; color: var(--ink-3); }
.pager-link span { font: 600 1.0625rem/1.3 var(--font-display); overflow-wrap: anywhere; }
.pager-link.next { text-align: right; grid-column: 2; }
.foot-meta { display: flex; flex-wrap: wrap; gap: 8px 20px; justify-content: space-between; margin-top: 26px; padding-top: 18px; border-top: 1px solid var(--line); font-size: .875rem; color: var(--ink-3); }
.foot-meta code { font: 500 .8125rem var(--font-mono); overflow-wrap: anywhere; }
.foot-meta a { color: var(--ink-2); text-underline-offset: 3px; }

/* ---------- Índice da página ---------- */
.toc { position: sticky; top: var(--header-h); height: calc(100vh - var(--header-h)); overflow-y: auto; padding: 44px 24px 40px 8px; font-size: .875rem; scrollbar-width: none; }
.toc-title { font: 600 .875rem var(--font-display); margin: 0 0 10px; color: var(--ink); }
.toc ul { list-style: none; margin: 0; padding: 0; border-left: 1px solid var(--line); }
.toc a { display: block; padding: 5px 0 5px 14px; margin-left: -1px; border-left: 1px solid transparent; color: var(--ink-3); text-decoration: none; line-height: 1.4; }
.toc a:hover { color: var(--ink); }
.toc a.lvl-3 { padding-left: 28px; }
.toc a[aria-current="true"] { color: var(--brand); border-left-color: var(--brand); font-weight: 600; }

/* ---------- Página em branco ---------- */
.empty { margin-top: 12px; padding: 44px 28px; text-align: center; border: 1px dashed var(--line); border-radius: 16px; }
.empty svg { width: 34px; height: 34px; color: var(--ink-3); }
.empty-title { font: 650 1.25rem/1.3 var(--font-display); margin: 12px 0 6px; }
.empty p { color: var(--ink-2); margin: 0 auto 18px; max-width: 34rem; }

.btn { display: inline-flex; align-items: center; gap: 8px; height: 42px; padding: 0 18px; border-radius: 999px; font-size: .9375rem; font-weight: 600; text-decoration: none; }
.btn-brand { background: var(--brand); color: var(--bg); }
.btn-light { background: #fff; color: #1b2147; }
.btn-light:hover { background: #eef0ff; }
.btn-ghost { color: #fff; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .55); }
.btn-ghost:hover { background: rgba(255, 255, 255, .14); }

/* ---------- Home ---------- */
.hero { position: relative; isolation: isolate; overflow: hidden; border-radius: 22px; min-height: 340px; display: flex; align-items: flex-end; padding: clamp(26px, 5vw, 52px); color: #fff; background: #2c3fa6; }
.wash {
  position: absolute; inset: -30%; z-index: -2;
  background:
    radial-gradient(34% 42% at 74% 30%, #4ccbf9 0, transparent 72%),
    radial-gradient(30% 40% at 90% 74%, #ff7d74 0, transparent 72%),
    radial-gradient(32% 44% at 62% 70%, #c97fec 0, transparent 74%),
    radial-gradient(46% 56% at 30% 44%, #3c52cb 0, transparent 76%),
    #2c3fa6;
  filter: url(#brush);
}
.hero::before { content: ""; position: absolute; inset: 0; z-index: -1; background: linear-gradient(100deg, rgba(27, 36, 112, .6), rgba(27, 36, 112, .28) 55%, rgba(27, 36, 112, 0) 85%); }
.hero::after { content: ""; position: absolute; inset: 0; z-index: -1; filter: url(#grain); opacity: .3; mix-blend-mode: overlay; }
.hero h1 { font: 700 clamp(2.1rem, 4.6vw, 3.4rem)/1.03 var(--font-display); letter-spacing: -.028em; margin: 0 0 16px; max-width: 15ch; text-wrap: balance; }
.hero p { font-size: 1.125rem; line-height: 1.55; margin: 0 0 24px; max-width: 34rem; color: rgba(255, 255, 255, .92); }
.hero-actions { display: flex; flex-wrap: wrap; gap: 10px; }
.home-h { font: 650 1.375rem/1.25 var(--font-display); letter-spacing: -.01em; margin: 48px 0 16px; }
.areas { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
.area { display: flex; flex-direction: column; gap: 6px; padding: 22px 24px; background: var(--bg); color: var(--ink); text-decoration: none; }
.area:hover { background: var(--bg-soft); }
.area-name { font: 650 1.125rem/1.3 var(--font-display); }
.area-about { color: var(--ink-2); font-size: .9688rem; line-height: 1.5; }
.area-count { margin-top: auto; padding-top: 8px; font-size: .8125rem; color: var(--ink-3); }
.shortlist { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
.shortlist a { display: grid; grid-template-columns: 15rem 1fr; gap: 6px 24px; padding: 14px 4px; border-bottom: 1px solid var(--line); color: var(--ink); text-decoration: none; }
.shortlist a:hover strong { color: var(--brand); }
.shortlist strong { font-weight: 600; }
.shortlist span { color: var(--ink-2); font-size: .9688rem; }

/* ---------- Busca ---------- */
.search { width: min(620px, calc(100vw - 32px)); margin: 12vh auto 0; padding: 0; border: 1px solid var(--line); border-radius: 16px; background: var(--bg); color: var(--ink); box-shadow: var(--shadow-pop); overflow: hidden; }
.search::backdrop { background: rgba(14, 17, 34, .5); backdrop-filter: blur(3px); }
.search-field { display: flex; align-items: center; gap: 12px; padding: 0 16px; border-bottom: 1px solid var(--line); color: var(--ink-3); }
.search-field input { flex: 1; min-width: 0; height: 54px; border: 0; outline: 0; background: none; color: var(--ink); font: inherit; }
.search-field input::-webkit-search-cancel-button { display: none; }
.results { list-style: none; margin: 0; padding: 8px; max-height: min(56vh, 420px); overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }

<template data-page="getting-started/quickstart"
  data-lead="Do clone ao primeiro GET /health: ambiente virtual, dependências, variáveis de ambiente e os dois serviços rodando na sua máquina.">
  <h2>1. Atualize o projeto</h2>
  <p>Comece na branch certa e com o código em dia. Crie a sua branch a partir de <code>production</code>.</p>
  <pre data-lang="bash"><code>
git checkout production
git pull
git checkout -b nome-da-sua-branch
</code></pre>

  <h2>2. Crie o ambiente virtual</h2>
  <div class="callout" data-kind="info"><p><strong>Requisito.</strong> Use a versão do Python fixada em <code>.python-version</code>. Outras versões podem instalar, mas não são testadas.</p></div>
  <pre data-lang="bash"><code>
python -m venv .venv
</code></pre>

  <h2>3. Ative o ambiente virtual</h2>
  <div class="tabs">
    <div data-tab="PowerShell">
      <pre data-lang="bash"><code>
.\.venv\Scripts\Activate.ps1
</code></pre>
    </div>
    <div data-tab="CMD">
      <pre data-lang="bash"><code>
.venv\Scripts\activate.bat
</code></pre>
    </div>
    <div data-tab="macOS e Linux">
      <pre data-lang="bash"><code>
source .venv/bin/activate
</code></pre>
    </div>
  </div>
  <p>Depois de ativar, o prompt do terminal passa a começar com <code>(.venv)</code>.</p>

  <h2>4. Instale as dependências</h2>
  <p>O <code>uv</code> é a fonte da verdade para as dependências. Ele lê o <code>pyproject.toml</code> e o <code>uv.lock</code>.</p>
  <pre data-lang="bash"><code>
uv sync
</code></pre>

  <h2>5. Configure as variáveis de ambiente</h2>
  <p>Crie um arquivo <code>.env</code> na raiz do projeto. Estas são as variáveis que mais importam para subir a API:</p>
  <table>
    <thead><tr><th>Variável</th><th>Descrição</th></tr></thead>
    <tbody>
      <tr><td><code>BETTERAI_API_KEY</code></td><td>Chave interna usada no cabeçalho <code>X-API-Key</code></td></tr>
      <tr><td><code>OPENAI_API_KEY</code></td><td>Chave de API da OpenAI</td></tr>
      <tr><td><code>ANTHROPIC_API_KEY</code></td><td>Chave de API da Anthropic</td></tr>
      <tr><td><code>GEMINI_API_KEY</code></td><td>Chave de API do Google Gemini</td></tr>
      <tr><td><code>PINECONE_API_KEY</code></td><td>Chave de API do Pinecone</td></tr>
      <tr><td><code>NOSQL_BACKEND</code></td><td>Backend NoSQL: <code>local</code> ou remoto</td></tr>
      <tr><td><code>LOCAL</code></td><td>Execução local. Com <code>true</code>, a API não exige chave</td></tr>
    </tbody>
  </table>
  <details>
    <summary>Ver o modelo completo do .env</summary>
    <pre data-lang="env" data-title=".env"><code>
# BetterAI
BETTERAI_API_KEY=********************

# LLMs
OPENAI_API_KEY=********************
OPENAI_EMBEDDING_MODEL=text-embedding-3-large
GEMINI_API_KEY=********************
GROQ_API_KEY=********************
ANTHROPIC_API_KEY=********************

# Pinecone
PINECONE_API_KEY=********************
PINECONE_ENVIRONMENT=us-east-1
PINECONE_NAMESPACE=knowledge_base

# Regras de tracing
SHOW_INFO_LOGS=false
SAVE_LOGS=false
LOCAL=false
</code></pre>
  </details>
  <div class="callout" data-kind="warn"><p><strong>Só em desenvolvimento.</strong> <code>LOCAL=true</code> desliga a autenticação por chave em todas as rotas. Nunca use em homologação ou produção.</p></div>

  <h2>6. Execute a aplicação</h2>
  <p>O projeto tem dois serviços independentes. Rode cada um no seu terminal.</p>
  <table>
    <thead><tr><th>Serviço</th><th>Comando</th><th>Porta</th></tr></thead>
    <tbody>
      <tr><td>API (FastAPI)</td><td><code>uvicorn web_services:app --reload</code></td><td><code>8000</code></td></tr>
      <tr><td>Interface (Streamlit)</td><td><code>streamlit run web_app.py</code></td><td><code>8501</code></td></tr>
    </tbody>
  </table>
  <h3>API</h3>
  <pre data-lang="bash"><code>
uvicorn web_services:app --reload
</code></pre>
  <pre data-lang="output"><code>
INFO:     Uvicorn running on http://127.0.0.1:8000 (Press CTRL+C to quit)
INFO:     Router included: /agents
INFO:     Router included: /davinci
INFO:     Router included: /deep-research
INFO:     Router included: /parse-content
INFO:     Router included: /vector-store
INFO:     BetterAI Web Service Network initialized successfully.
INFO:     Application startup complete.
</code></pre>
  <p>Confirme que a API respondeu antes de seguir:</p>
  <pre data-lang="bash"><code>
curl -X GET "http://127.0.0.1:8000/health"
</code></pre>
  <div class="callout" data-kind="ok"><p><strong>Pronto.</strong> Se o <code>/health</code> respondeu, a documentação interativa está em <code>http://localhost:8000/docs</code>.</p></div>
  <h3>Interface Streamlit</h3>
  <pre data-lang="bash"><code>
streamlit run web_app.py
</code></pre>
  <p>A interface abre em <code>http://localhost:8501</code>, com o <a href="#/streamlit-applications/acquarello">Acquarello</a> e o <a href="#/streamlit-applications/content-generator">Content Generator</a>.</p>

  <h2>Resolução de problemas</h2>
  <table>
    <thead><tr><th>Sintoma</th><th>Causa provável</th><th>O que fazer</th></tr></thead>
    <tbody>
      <tr><td><code>ModuleNotFoundError</code> ao iniciar</td><td>Ambiente virtual desativado ou dependências ausentes</td><td>Reative o <code>.venv</code> e rode <code>uv sync</code></td></tr>
      <tr><td>Erro de autenticação nos provedores</td><td>Chave ausente ou inválida no <code>.env</code></td><td>Revise o passo 5</td></tr>
      <tr><td>Porta já em uso</td><td>Outra instância do serviço está ativa</td><td>Encerre o processo anterior ou use <code>--port</code></td></tr>
    </tbody>
  </table>
</template>

<template data-page="modules/agents/utils/model-gateway"
  data-lead="Uma fábrica única para criar modelos e agentes Agno de qualquer provedor, com os parâmetros validados antes da chamada.">
  <h2>Visão geral</h2>
  <p>A <code>ModelGateway</code> esconde as diferenças entre as APIs da Anthropic, do Google, da Groq e da OpenAI. Você informa o provedor e os parâmetros, e ela resolve a classe certa, confere os argumentos contra a assinatura real do construtor e devolve o modelo pronto.</p>
  <p>Trocar de modelo passa a ser uma decisão de configuração, não uma refatoração.</p>
  <div class="callout" data-kind="info"><p>Todo código novo de agente deve criar modelos por aqui, em vez de importar os SDKs dos provedores diretamente.</p></div>

  <h2>Uso</h2>
  <div class="tabs">
    <div data-tab="Criar um modelo">
      <pre data-lang="python"><code>
from src.agents.utils.model_gateway import ModelGateway

gateway = ModelGateway(strict_validation=True)

model = gateway.create_model(
    provider="anthropic",
    model_id="claude-sonnet-5-5",
    temperature=0.2,
)
</code></pre>
    </div>
    <div data-tab="Criar um agente">
      <pre data-lang="python"><code>
agent = gateway.create_agent(
    provider="google",
    model_id="gemini-2.5-flash",
    instructions="Responda em português e cite as fontes.",
    markdown=True,
)

agent.print_response("Resuma o catálogo de produtos.")
</code></pre>
    </div>
    <div data-tab="Atalhos por provedor">
      <pre data-lang="python"><code>
# Um método por provedor, sem informar o provider
model = gateway.openai_chat(model_id="gpt-4o-mini")
model = gateway.groq(model_id="llama-3.3-70b-versatile")
</code></pre>
    </div>
  </div>

  <h2>Fluxo de execução</h2>
  <ol>
    <li>Instancie a <code>ModelGateway</code>, escolhendo se a validação é estrita.</li>
    <li>Chame <code>create_model</code> com o <code>provider</code> e, se quiser, o <code>model_id</code>.</li>
    <li>A classe normaliza o nome do provedor e resolve o construtor correspondente.</li>
    <li>Com validação estrita, cada parâmetro é conferido contra a assinatura do construtor.</li>
    <li>O modelo é criado e devolvido.</li>
  </ol>

  <h2>Métodos</h2>
  <table>
    <thead><tr><th>Método</th><th>Descrição</th></tr></thead>
    <tbody>
      <tr><td><code>supported_providers</code></td><td>Lista os provedores aceitos</td></tr>
      <tr><td><code>supported_parameters</code></td><td>Lista os parâmetros válidos para um modelo</td></tr>
      <tr><td><code>create_model</code></td><td>Cria uma instância do modelo escolhido</td></tr>
      <tr><td><code>create_agent</code></td><td>Cria um agente Agno já configurado com o modelo</td></tr>
      <tr><td><code>anthropic</code>, <code>google</code>, <code>groq</code></td><td>Atalhos por provedor</td></tr>
      <tr><td><code>openai_chat</code>, <code>openai_responses</code></td><td>Atalhos para as variantes da OpenAI</td></tr>
    </tbody>
  </table>

  <h2>Referência</h2>
  <h3>create_model</h3>
  <p>Cria e devolve uma instância do modelo do provedor informado.</p>
  <table>
    <thead><tr><th>Argumento</th><th>Tipo</th><th>Padrão</th><th>Descrição</th></tr></thead>
    <tbody>
      <tr><td><code>provider</code></td><td><code>str</code></td><td>obrigatório</td><td>Nome ou apelido do provedor, como <code>anthropic</code> ou <code>claude</code></td></tr>
      <tr><td><code>model_id</code></td><td><code>str | None</code></td><td><code>None</code></td><td>Identificador do modelo. Sem ele, vale o padrão do provedor</td></tr>
      <tr><td><code>openai_variant</code></td><td><code>str</code></td><td><code>"chat"</code></td><td>Variante da OpenAI: <code>chat</code>, <code>responses</code>, <code>open_responses</code> ou <code>like</code></td></tr>
      <tr><td><code>**kwargs</code></td><td><code>Any</code></td><td></td><td>Parâmetros repassados ao construtor do modelo</td></tr>
    </tbody>
  </table>
  <div class="callout" data-kind="danger"><p><strong>Levanta <code>ValueError</code></strong> quando o provedor não é reconhecido ou, com validação estrita, quando um parâmetro não existe no construtor do modelo.</p></div>

  <h3>create_agent</h3>
  <p>Chama <code>create_model</code> por dentro e devolve um <code>agno.agent.Agent</code> configurado. Aceita os mesmos argumentos de modelo, mais os do agente.</p>

  <h2>Variáveis de ambiente</h2>
  <p>O módulo chama <code>load_dotenv()</code> ao ser importado. A classe não lê variáveis diretamente, mas os modelos dependem das chaves de cada provedor:</p>
  <ul>
    <li><code>OPENAI_API_KEY</code> para os modelos da OpenAI</li>
    <li><code>ANTHROPIC_API_KEY</code> para os modelos da Anthropic</li>
    <li><code>GEMINI_API_KEY</code> para os modelos do Google</li>
  </ul>
</template>

<template data-page="modules/web-service-network/web-service-network-api"
  data-lead="A API FastAPI que expõe os serviços de IA. Autenticação, formato das respostas e os endpoints disponíveis.">
  <h2>Autenticação</h2>
  <p>Toda rota protegida exige o cabeçalho <code>X-API-Key</code> com o valor de <code>BETTERAI_API_KEY</code>.</p>
  <pre data-lang="bash"><code>
curl "http://localhost:8000/health-authorization" \
  -H "X-API-Key: $BETTERAI_API_KEY"
</code></pre>
  <div class="callout" data-kind="warn"><p>Com <code>LOCAL=true</code>, a verificação da chave é ignorada. Use só na sua máquina.</p></div>

  <h2>Formato das respostas</h2>
  <p>Toda resposta segue o mesmo envelope, seja qual for o serviço.</p>
  <pre data-lang="json"><code>
{
  "job_id": "b7f3c1e2-4a9d-4c1b-9f6e-2d8a5e0c7f41",
  "status": "completed",
  "result": {},
  "time": {
    "started_at": "2026-08-17T08:55:20Z",
    "duration_seconds": 3.42
  }
}
</code></pre>

  <h2>Endpoints</h2>
  <table>
    <thead><tr><th>Endpoint</th><th>Descrição</th></tr></thead>
    <tbody>
      <tr><td><code>GET /health</code></td><td>Verifica se o serviço está disponível</td></tr>
      <tr><td><code>POST /deep-research/context-builder</code></td><td>Monta contexto a partir de pesquisa web</td></tr>
      <tr><td><code>POST /parse-content/document-parse</code></td><td>Extrai dados estruturados de documentos</td></tr>
      <tr><td><code>POST /davinci/image-generation</code></td><td>Gera imagens</td></tr>
    </tbody>
  </table>

  <h3>Extrair dados de um documento</h3>
  <div class="endpoint"><span class="method" data-m="POST">POST</span><span>/parse-content/document-parse</span></div>
  <p>Converte arquivos <code>txt</code>, <code>md</code>, <code>pdf</code> e <code>docx</code> em dados estruturados, seguindo o schema que você envia.</p>
  <div class="tabs">
    <div data-tab="cURL">
      <pre data-lang="bash"><code>
curl -X POST "http://localhost:8000/parse-content/document-parse" \
  -H "X-API-Key: $BETTERAI_API_KEY" \
  -F "file=@contrato.pdf" \
  -F 'metadata={"fields":[{"name":"valor_total","type":"float"}]}'
</code></pre>
    </div>
    <div data-tab="Python">
      <pre data-lang="python"><code>
import requests

response = requests.post(
    "http://localhost:8000/parse-content/document-parse",
    headers={"X-API-Key": api_key},
    files={"file": open("contrato.pdf", "rb")},
    data={"metadata": '{"fields":[{"name":"valor_total","type":"float"}]}'},
)
print(response.json()["result"])
</code></pre>
    </div>
    <div data-tab="Resposta">
      <pre data-lang="json"><code>
{
  "job_id": "b7f3c1e2-4a9d-4c1b-9f6e-2d8a5e0c7f41",
  "status": "completed",
  "result": {
    "valor_total": 18450.0
  },
  "time": {
    "duration_seconds": 3.42
  }
}
</code></pre>
    </div>
  </div>

  <h3>Verificar disponibilidade</h3>
  <div class="endpoint"><span class="method" data-m="GET">GET</span><span>/health</span></div>
  <p>Não exige chave. Use para checagens de infraestrutura.</p>

  <h2>Streaming</h2>
  <p>As rotas de agentes respondem por SSE. Cada evento é uma linha <code>data:</code> com um JSON e um campo <code>event</code>.</p>
  <table>
    <thead><tr><th>Evento</th><th>Quando acontece</th></tr></thead>
    <tbody>
      <tr><td><code>StreamStart</code></td><td>A execução começou</td></tr>
      <tr><td><code>AgentChunk</code></td><td>Chegou um trecho de texto do agente</td></tr>
      <tr><td><code>ToolCallCompleted</code></td><td>Uma ferramenta terminou e devolveu metadados</td></tr>
      <tr><td><code>StreamEnd</code></td><td>A execução terminou</td></tr>
    </tbody>
  </table>
</template>

<template data-page="streamlit-applications/acquarello"
  data-lead="Geração de imagens em dois modos, com controle de estilo visual, para quem não quer lidar com prompts complexos.">
  <div class="video-frame">
    <video controls preload="metadata" src="../Streamlit%20Applications/videos/acquarello.mp4"></video>
    <div class="video-missing" hidden><strong>Vídeo de demonstração</strong><span>Aqui entra <code>videos/acquarello.mp4</code></span></div>
  </div>

  <h2>Como abrir</h2>
  <p>Com a interface Streamlit rodando, o Acquarello fica em <code>http://localhost:8501/acquarello</code>.</p>
  <pre data-lang="bash"><code>
streamlit run web_app.py
</code></pre>

  <h2>Modos de geração</h2>
  <h3>Texto para imagem</h3>
  <p>Descreva a cena em linguagem comum. O Acquarello monta o prompt final combinando a sua descrição com o estilo visual escolhido.</p>
  <h3>Imagem para imagem</h3>
  <p>Envie uma ou mais imagens de referência e diga o que mudar. As referências guiam a composição e as cores do resultado.</p>
  <figure>

</template>

<script>
(() => {
  'use strict';
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const slug = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');

  const ICON = {
    chevron: '<path d="m9 6 6 6-6 6"/>',
    sun: '<circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6 7 7M17 17l1.4 1.4M5.6 18.4 7 17M17 7l1.4-1.4"/>',
    moon: '<path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/>',
    copy: '<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/>',
    check: '<path d="m5 12.5 4.5 4.5L19 7.5"/>',
    file: '<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/>',
    notebook: '<rect x="6" y="3" width="13" height="18" rx="2"/><path d="M4 7h3M4 12h3M4 17h3M11 8h4"/>',
    info: '<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 7.6v.2"/>',
    warn: '<path d="M12 4 2.8 19.5h18.4z"/><path d="M12 10v4.5M12 17.2v.2"/>',
    ok: '<circle cx="12" cy="12" r="9"/><path d="m8 12.5 2.8 2.8L16 9.6"/>',
    danger: '<circle cx="12" cy="12" r="9"/><path d="m9 9 6 6M15 9l-6 6"/>',
    blank: '<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/>'
  };
  const ico = n => `<svg class="ico" viewBox="0 0 24 24" aria-hidden="true">${ICON[n]}</svg>`;

  /* ---------- Árvore da documentação (espelha a pasta doc/) ---------- */
  const md = (t, file) => ({ t, ext: 'md', file });
  const nb = (t, file) => ({ t, ext: 'ipynb', file });
  const blank = t => ({ t, ext: 'ipynb', empty: true });
  const dir = (t, kids) => ({ t, kids });

  const TREE = [
    { t: 'Getting Started', about: 'Instalação, dependências e licença. Do clone ao primeiro request.', kids: [
      nb('Quickstart', '1. Quickstart'), nb('Dependences', '2. Dependences'), nb('Licence', '3. Licence')
    ] },
    { t: 'Modules', about: 'Os serviços de IA: agentes, parsing de documentos, deep research, embeddings, imagens, Pinecone e a API.', kids: [
      dir('Agents', [dir('Utils', [md('Database'), md('Model Gateway')])]),
      dir('Content Parse', [
        dir('Content Parsing Agent', [md('Documentation'), md('Use')]),
        md('Document Parse'), md('Field Metadata Parser'), md('Generate Pydantic Schema'), md('Json To Pydantic')
      ]),
      dir('Deep Research', [dir('Tavily Research', [blank('Context Builder'), blank('Tavily Core')])]),
      dir('Embedding', [
        nb('Delete Embeddings'), nb('Embedding Module'),
        dir('Local Dynamic Embedding', [nb('Documentation'), nb('Use')])
      ]),
      dir('Image Generation', [
        blank('Module'), blank('Image Generator Service'),
        dir('Cost Calculator', [blank('Cost Calculator'), blank('Pricing Table')]),
        dir('Utils', [blank('Config'), blank('Gemini Client'), blank('Params Validator'), blank('Payload Builder')])
      ]),
      dir('Pinecone Vector Store', [md('Pinecone Client'), md('Pinecone Retriever'), md('Pinecone Vector Service'), md('Retrieval Manager')]),
      dir('Web Service Network', [nb('Curl Compiler'), nb('Web Service API'), nb('Web Service Network - API')])
    ] },
    { t: 'Internal Source Code', about: 'A infraestrutura por baixo: tracing, bancos de dados, storage, custo por token e utilitários.', kids: [
      nb('AgnoUI'),
      dir('Application Tracing', [nb('Logger Engine'), nb('Payload Builder'), nb('Tracing Core'), blank('Use')]),
      dir('Database', [
        dir('No SQL', [nb('Local Manage'), nb('Mongo Manager'), nb('Router')]),
        dir('SQL', [nb('Supabase Database')])
      ]),
      dir('Storage', [nb('Storage Menage Repository'), dir('Supabase', [nb('Storage Menager')])]),
      dir('Token Calculate', [
        dir('Exchange Rate', [md('BCB Exchange Rate Service'), md('Exchange Rate Service')]),
        md('Model Pricing'), md('Token Counter')
      ]),
      dir('Utils', [dir('Load Request File', [md('Documentation'), md('Use')]), nb('Loader Files'), nb('Unique ID Factory')]),
      dir('Vector Store', [nb('Pinecone Client'), nb('Pinecone Embedding'), nb('Pinecone Retriever')])
    ] },
    { t: 'Streamlit Applications', about: 'Acquarello e Content Generator, as duas aplicações que rodam sobre a plataforma.', kids: [
      nb('Acquarello'), nb('Content Generator')
    ] }
  ];

  const HOME = { id: 'home', t: 'Bem-vindo', path: [], home: true };
  const PAGES = [HOME];
  (function walk(nodes, path) {
    for (const n of nodes) {
      n.path = path;
      n.id = [...path, n.t].map(slug).join('/');
      if (n.kids) walk(n.kids, [...path, n.t]);
      else {
        n.src = 'doc/' + [...path, (n.file || n.t) + '.' + n.ext].join('/');
        PAGES.push(n);
      }
    }
  })(TREE, []);
  const BY_ID = new Map(PAGES.map(p => [p.id, p]));
  const countPages = n => n.kids ? n.kids.reduce((a, k) => a + countPages(k), 0) : 1;
  const firstPage = n => n.kids ? firstPage(n.kids[0]) : n;

  /* ---------- Navegação lateral ---------- */
  const nav = $('#nav');
  function nodeHtml(n) {
    if (n.kids) {
      return `<li><button class="nav-folder" type="button" aria-expanded="false"><span>${esc(n.t)}</span>${ico('chevron')}</button><ul hidden>${n.kids.map(nodeHtml).join('')}</ul></li>`;
    }
    return `<li><a class="nav-link${n.empty ? ' is-empty' : ''}" href="#/${n.id}" data-id="${n.id}"><span>${esc(n.t)}</span>${n.empty ? '<span class="nav-tag">em branco</span>' : ''}</a></li>`;
  }
  nav.innerHTML =
    `<a class="nav-link" href="#/" data-id="home"><span>Bem-vindo</span></a>` +
    TREE.map(s => `<div class="nav-group"><p class="nav-title">${esc(s.t)}</p><ul>${s.kids.map(nodeHtml).join('')}</ul></div>`).join('');
  $('#pageCount').textContent = (PAGES.length - 1) + ' páginas';

  nav.addEventListener('click', e => {
    const f = e.target.closest('.nav-folder');
    if (!f) return;
    const open = f.getAttribute('aria-expanded') !== 'true';
    f.setAttribute('aria-expanded', open);
    f.nextElementSibling.hidden = !open;
  });

  function markActive(id) {
    $$('.nav-link', nav).forEach(a => a.removeAttribute('aria-current'));
    const link = $(`.nav-link[data-id="${id}"]`, nav);
    if (!link) return;
    link.setAttribute('aria-current', 'page');
    for (let ul = link.closest('ul'); ul && nav.contains(ul); ul = ul.parentElement.closest('ul')) {
      const btn = ul.previousElementSibling;
      if (btn && btn.classList.contains('nav-folder')) { ul.hidden = false; btn.setAttribute('aria-expanded', 'true'); }
    }
    const box = nav.getBoundingClientRect(), r = link.getBoundingClientRect();
    if (r.top < box.top + 8 || r.bottom > box.bottom - 8) nav.scrollTop += r.top - box.top - box.height / 3;
  }

  /* ---------- Realce de código ---------- */
  const STR = `"(?:\\\\.|[^"\\\\\\n])*"|'(?:\\\\.|[^'\\\\\\n])*'`;
  const RULES = {
    python: [new RegExp(`(#.*$)|(${STR})|\\b(def|class|return|import|from|as|if|else|elif|for|in|while|try|except|raise|with|and|or|not|lambda|await|async|pass)\\b|\\b(None|True|False|\\d+(?:\\.\\d+)?)\\b|([A-Za-z_]\\w*)(?=\\()`, 'gm'), ['c', 's', 'k', 'n', 'f']],
    bash: [new RegExp(`((?:^|(?<=\\s))#.*$)|(${STR})|((?<=\\s)--?[A-Za-z][\\w-]*)|(^[ \\t]*[A-Za-z.][\\w.\\\\/-]*)`, 'gm'), ['c', 's', 'k', 'f']],
    json: [new RegExp(`("(?:\\\\.|[^"\\\\])*")(?=\\s*:)|("(?:\\\\.|[^"\\\\])*")|\\b(true|false|null)\\b|(-?\\b\\d+(?:\\.\\d+)?\\b)`, 'g'), ['f', 's', 'k', 'n']],
    env: [/(#.*$)|(^[A-Z_]+)(?==)/gm, ['c', 'f']]
  };
  const LANG = { python: 'Python', bash: 'Terminal', json: 'JSON', env: '.env', output: 'Saída' };
  function highlight(src, lang) {
    const rule = RULES[lang];
    if (!rule) return esc(src);
    const [re, cls] = rule;
    re.lastIndex = 0;
    let out = '', last = 0, m;
    while ((m = re.exec(src))) {
      if (!m[0]) { re.lastIndex++; continue; }
      const gi = m.slice(1).findIndex(g => g !== undefined);
      out += esc(src.slice(last, m.index)) + `<span class="t-${cls[gi]}">${esc(m[0])}</span>`;
      last = m.index + m[0].length;
    }
    return out + esc(src.slice(last));
  }

  /* ---------- Conteúdo de exemplo para páginas sem modelo ---------- */
  function sampleBody(p) {
    const cls = p.t.replace(/[^A-Za-z0-9]+/g, '');
    return `
      <div class="callout" data-kind="info"><p><strong>Conteúdo de exemplo.</strong> Este texto existe só para validar o layout. Na versão final, a página é gerada a partir de <code>${esc(p.src)}</code>.</p></div>
      <h2>Visão geral</h2>
      <p>${esc(p.t)} faz parte de ${esc(p.path.join(' / '))}. Esta seção explica para que o componente serve, qual problema ele resolve e onde ele entra no restante da plataforma.</p>
      <p>Um segundo parágrafo mostra o ritmo do texto corrido, com <code>código inline</code>, um <a href="#/getting-started/quickstart">link interno</a> e <strong>ênfase</strong>.</p>
      <h2>Fluxo de execução</h2>
      <ol>
        <li>Instancie a classe com a configuração do ambiente.</li>
        <li>Chame o método principal com os dados de entrada.</li>
        <li>Trate o retorno, que segue o envelope padrão da plataforma.</li>
      </ol>
      <h2>Métodos</h2>
      <table>
        <thead><tr><th>Método</th><th>Descrição</th></tr></thead>
        <tbody>
          <tr><td><code>__init__</code></td><td>Inicializa a instância com a configuração recebida</td></tr>
          <tr><td><code>run</code></td><td>Executa a operação principal e devolve o resultado</td></tr>
          <tr><td><code>validate</code></td><td>Confere os parâmetros antes da execução</td></tr>
        </tbody>
      </table>
      <h2>Exemplo de uso</h2>
      <pre data-lang="python"><code>service = ${cls}(local=True)
result = service.run(payload)

print(result["status"])  # completed</code></pre>
      <h2>Pontos de atenção</h2>
      <ul>
        <li>As credenciais vêm do arquivo <code>.env</code>.</li>
        <li>Toda execução gera um registro de tracing com <code>log_id</code>.</li>
      </ul>`;
  }

  function emptyBody(p, next) {
    return `
      <div class="empty">
        ${ico('blank')}
        <p class="empty-title">Esta página ainda está em branco</p>
        <p>O arquivo <code>${esc(p.src)}</code> existe, mas não tem conteúdo. Quando ele for preenchido, o texto aparece aqui.</p>
        ${next ? `<a class="btn btn-brand" href="#/${next.id}">Ir para ${esc(next.t)}</a>` : ''}
      </div>`;
  }

  function homeBody() {
    const areas = TREE.map(s => {
      const n = countPages(s);
      return `<a class="area" href="#/${firstPage(s).id}">
        <span class="area-name">${esc(s.t)}</span>
        <span class="area-about">${esc(s.about)}</span>
        <span class="area-count">${n} páginas</span>
      </a>`;
    }).join('');
    return `
      <section class="hero">
        <div class="wash" aria-hidden="true"></div>
        <div>
          <h1 class="page-title" tabindex="-1">Múltiplos modelos de IA, um único back-end</h1>
          <p>Um back-end modular em Python que coloca OpenAI, Anthropic, Google Gemini e Groq atrás da mesma interface. Aqui estão a API, os agentes e as aplicações que rodam sobre ele.</p>
          <div class="hero-actions">
            <a class="btn btn-light" href="#/getting-started/quickstart">Começar pelo Quickstart</a>
            <button class="btn btn-ghost" type="button" data-open-search>Buscar na documentação</button>
          </div>
        </div>
      </section>
      <h2 class="home-h">Explore por área</h2>
      <div class="areas">${areas}</div>
      <h2 class="home-h">Mais consultadas</h2>
      <ul class="shortlist">
        <li><a href="#/modules/agents/utils/model-gateway"><strong>Model Gateway</strong><span>Crie modelos e agentes de qualquer provedor pela mesma chamada.</span></a></li>
        <li><a href="#/modules/web-service-network/web-service-network-api"><strong>Web Service Network - API</strong><span>Autenticação, formato das respostas e endpoints.</span></a></li>
        <li><a href="#/streamlit-applications/acquarello"><strong>Acquarello</strong><span>Geração de imagens com controle de estilo visual.</span></a></li>
      </ul>`;
  }

  /* ---------- Renderização da página ---------- */
  const pageEl = $('#page'), tocEl = $('#toc');
  let headings = [], currentId = null;

  function render(p) {
    currentId = p.id;
    document.body.classList.toggle('is-home', !!p.home);
    document.title = p.home ? 'BetterAI Docs' : `${p.t} | BetterAI Docs`;
    const i = PAGES.indexOf(p), prev = PAGES[i - 1], next = PAGES[i + 1];

    if (p.home) {
      pageEl.innerHTML = homeBody();
    } else {
      const tpl = $(`template[data-page="${p.id}"]`);
      const body = p.empty ? emptyBody(p, next) : tpl ? tpl.innerHTML : sampleBody(p);
      const lead = p.empty ? '' : tpl ? tpl.dataset.lead : `Página de exemplo para ${p.t}, usada para validar o layout.`;
      pageEl.innerHTML = `
        <nav class="crumbs" aria-label="Você está em">${p.path.map(s => `<span>${esc(s)}</span>`).join('')}</nav>
        <h1 class="page-title" tabindex="-1">${esc(p.t)}</h1>
        ${lead ? `<p class="lead">${esc(lead)}</p>` : ''}
        <div class="page-meta">
          <span class="chip">${ico(p.ext === 'md' ? 'file' : 'notebook')}${p.ext === 'md' ? 'Markdown' : 'Notebook'}</span>
          <span>Atualizado em 23 ago 2026</span>
        </div>
        <details class="toc-inline"><summary>Nesta página</summary><ul></ul></details>
        <div class="prose">${body}</div>
        <footer class="page-foot">
          <nav class="pager" aria-label="Páginas vizinhas">
            ${prev ? `<a class="pager-link prev" href="#/${prev.home ? '' : prev.id}"><small>Anterior</small><span>${esc(prev.t)}</span></a>` : ''}
            ${next ? `<a class="pager-link next" href="#/${next.id}"><small>Próxima</small><span>${esc(next.t)}</span></a>` : ''}
          </nav>
          <div class="foot-meta"><span>Fonte: <code>${esc(p.src)}</code></span><a href="#" data-fake>Editar no GitHub</a></div>
        </footer>`;
      enhance($('.prose', pageEl));
    }
    buildToc(p);
    markActive(p.id);
  }

  function enhance(prose) {
    // tabelas roláveis
    $$('table', prose).forEach(t => { const w = document.createElement('div'); w.className = 'table-wrap'; t.replaceWith(w); w.append(t); });
    // blocos de código
    $$('pre', prose).forEach(pre => {
      const code = $('code', pre), lang = pre.dataset.lang || '';
      const raw = code.textContent.replace(/^\n/, '').replace(/\s+$/, '');
      code.innerHTML = highlight(raw, lang);
      const box = document.createElement('div');
      box.className = 'code';
      box.innerHTML = `<div class="code-bar"><span class="code-lang">${esc(pre.dataset.title || LANG[lang] || 'Texto')}</span><button class="copy" type="button">${ico('copy')}<span>Copiar</span></button></div>`;
      pre.replaceWith(box);
      box.append(pre);
      $('.copy', box).addEventListener('click', async e => {
        const b = e.currentTarget;
        try { await navigator.clipboard.writeText(raw); } catch (err) {}
        b.innerHTML = ico('check') + '<span>Copiado</span>';
        setTimeout(() => { b.innerHTML = ico('copy') + '<span>Copiar</span>'; }, 1600);
      });
    });
    // abas
    $$('.tabs', prose).forEach(tabs => {
      const panels = $$(':scope > [data-tab]', tabs);
      const list = document.createElement('div');
      list.className = 'tab-list';
      list.setAttribute('role', 'tablist');
      panels.forEach((panel, i) => {
        panel.classList.add('tab-panel');
        panel.setAttribute('role', 'tabpanel');
        panel.hidden = i > 0;
        const b = document.createElement('button');
        b.type = 'button'; b.className = 'tab-btn'; b.textContent = panel.dataset.tab;
        b.setAttribute('role', 'tab');
        b.setAttribute('aria-selected', i === 0);
        b.addEventListener('click', () => {
          $$('.tab-btn', list).forEach(x => x.setAttribute('aria-selected', x === b));
          panels.forEach(x => { x.hidden = x !== panel; });
        });
        list.append(b);
      });
      tabs.prepend(list);
    });
    // avisos
    $$('.callout', prose).forEach(c => c.insertAdjacentHTML('afterbegin', ico({ warn: 'warn', ok: 'ok', danger: 'danger' }[c.dataset.kind] || 'info')));
    // vídeo indisponível
    $$('.video-frame video', prose).forEach(v => v.addEventListener('error', () => { v.hidden = true; v.nextElementSibling.hidden = false; }));
    // âncoras nos títulos
    const seen = new Set();
    $$('h2, h3', prose).forEach(h => {
      let id = slug(h.textContent), n = 2;
      while (seen.has(id)) id = slug(h.textContent) + '-' + n++;
      seen.add(id);
      h.id = id;
      h.insertAdjacentHTML('afterbegin', `<a class="anchor" href="#/${currentId}::${id}" aria-label="Link para esta seção">#</a>`);
    });
  }

  function buildToc(p) {
    headings = p.home ? [] : $$('.prose h2, .prose h3', pageEl);
    const has = headings.length > 1;
    document.body.classList.toggle('no-toc', !p.home && !has);
    const items = headings.map(h => `<li><a class="lvl-${h.tagName[1]}" href="#/${p.id}::${h.id}" data-h="${h.id}">${esc(h.textContent.replace(/^#/, ''))}</a></li>`).join('');
    tocEl.innerHTML = has ? `<p class="toc-title">Nesta página</p><ul>${items}</ul>` : '';
    const inline = $('.toc-inline', pageEl);
    if (inline) { if (has) $('ul', inline).innerHTML = items; else inline.remove(); }
    spy();
  }

  /* ---------- Rolagem: seção ativa e progresso ---------- */
  const progress = $('.progress');
  function spy() {
    const max = document.documentElement.scrollHeight - innerHeight;
    progress.style.setProperty('--p', max > 0 ? Math.min(1, scrollY / max) : 0);
    if (!headings.length) return;
    let active = headings[0];
    for (const h of headings) { if (h.getBoundingClientRect().top <= 110) active = h; else break; }
    if (innerHeight + scrollY >= document.documentElement.scrollHeight - 4) active = headings[headings.length - 1];
    $$('a', tocEl).forEach(a => a.dataset.h === active.id ? a.setAttribute('aria-current', 'true') : a.removeAttribute('aria-current'));
  }
  let ticking = false;
  addEventListener('scroll', () => { if (!ticking) { ticking = true; requestAnimationFrame(() => { ticking = false; spy(); }); } }, { passive: true });
  addEventListener('resize', spy);

  /* ---------- Rotas ---------- */
  function route() {
    const [rawId, anchor] = decodeURIComponent(location.hash.replace(/^#\/?/, '')).split('::');
    const p = BY_ID.get(rawId || 'home') || HOME;
    const samePage = p.id === currentId;
    if (!samePage) render(p);
    closeNav();
    const target = anchor && document.getElementById(anchor);
    if (target) target.scrollIntoView();
    else if (!samePage) {
      scrollTo(0, 0);
      const h1 = $('.page-title', pageEl);
      if (h1) h1.focus({ preventScroll: true });
    }
    spy();
  }
  addEventListener('hashchange', route);
  document.addEventListener('click', e => {
    if (e.target.closest('[data-fake]')) e.preventDefault();
    if (e.target.closest('[data-open-search]')) openSearch();
    const inline = e.target.closest('.toc-inline a');
    if (inline) inline.closest('details').open = false;
  });

  /* ---------- Menu no celular ---------- */
  const menuBtn = $('#menuBtn');
  function closeNav() { document.body.classList.remove('nav-open'); menuBtn.setAttribute('aria-expanded', 'false'); }
  menuBtn.addEventListener('click', () => {
    const open = document.body.classList.toggle('nav-open');
    menuBtn.setAttribute('aria-expanded', open);
  });
  $('#scrim').addEventListener('click', closeNav);

  /* ---------- Tema ---------- */
  const themeBtn = $('#themeBtn');
  function paintTheme() { themeBtn.innerHTML = ico(document.documentElement.dataset.theme === 'dark' ? 'sun' : 'moon'); }
  themeBtn.addEventListener('click', () => {
    const t = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
    document.documentElement.dataset.theme = t;
    try { localStorage.setItem('betterai-docs-theme', t); } catch (e) {}
    paintTheme();
  });
  paintTheme();

  /* ---------- Busca ---------- */
  const dialog = $('#search'), q = $('#q'), results = $('#results');
  const INDEX = [];
  for (const p of PAGES) {
    if (p.home) continue;
    INDEX.push({ href: `#/${p.id}`, title: p.t, path: p.path.join(' / '), page: true });
    const tpl = $(`template[data-page="${p.id}"]`);
    if (tpl) $$('h2, h3', tpl.content).forEach(h => INDEX.push({ href: `#/${p.id}::${slug(h.textContent)}`, title: h.textContent, path: [...p.path, p.t].join(' / ') }));
  }
  const SUGGESTED = ['getting-started/quickstart', 'modules/agents/utils/model-gateway', 'modules/web-service-network/web-service-network-api', 'streamlit-applications/acquarello'];
  const fold = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
  function mark(text, term) {
    const i = term ? fold(text).indexOf(term) : -1;
    return i < 0 ? esc(text) : esc(text.slice(0, i)) + '<mark>' + esc(text.slice(i, i + term.length)) + '</mark>' + esc(text.slice(i + term.length));
  }
  let sel = 0;
  function search() {
    const term = fold(q.value.trim());
    let list, label = '';
    if (!term) {
      label = 'Sugestões';
      list = SUGGESTED.map(id => INDEX.find(x => x.href === `#/${id}`));
    } else {
      list = INDEX.map(x => {
        const t = fold(x.title), pth = fold(x.path);
        const score = t.startsWith(term) ? 0 : t.includes(term) ? 1 : pth.includes(term) ? 2 : -1;
        return { x, score: score < 0 ? -1 : score + (x.page ? 0 : .5) };
      }).filter(r => r.score >= 0).sort((a, b) => a.score - b.score).slice(0, 9).map(r => r.x);
    }
    sel = 0;
    results.innerHTML = list.length
      ? (label ? `<li class="results-label" role="presentation">${label}</li>` : '') +
        list.map((x, i) => `<li class="result" role="option" aria-selected="${i === 0}"><a href="${x.href}" tabindex="-1"><span class="r-title">${mark(x.title, term)}</span><span class="r-path">${mark(x.path, term)}</span></a></li>`).join('')
      : `<li class="no-results" role="presentation">Nada encontrado para “${esc(q.value.trim())}”. Tente o nome de um módulo, como “Pinecone”.</li>`;
  }
  function move(d) {
    const items = $$('.result', results);
    if (!items.length) return;
    sel = (sel + d + items.length) % items.length;
    items.forEach((li, i) => li.setAttribute('aria-selected', i === sel));
    items[sel].scrollIntoView({ block: 'nearest' });
  }
  function openSearch() { if (dialog.open) return; closeNav(); q.value = ''; search(); dialog.showModal(); q.focus(); }
  q.addEventListener('input', search);
  q.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown') { e.preventDefault(); move(1); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); move(-1); }
    else if (e.key === 'Enter') { e.preventDefault(); const a = $('.result[aria-selected="true"] a', results); if (a) { dialog.close(); location.hash = a.getAttribute('href'); } }
  });
  results.addEventListener('click', e => { if (e.target.closest('a')) dialog.close(); });
  dialog.addEventListener('click', e => { if (e.target === dialog) dialog.close(); });
  addEventListener('keydown', e => {
    const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
    if ((e.key.toLowerCase() === 'k' && (e.ctrlKey || e.metaKey)) || (e.key === '/' && !typing)) { e.preventDefault(); openSearch(); }
    if (e.key === 'Escape') closeNav();
  });

  route();
})();
</script>
</body>
</html>
