<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BetterAI Docs</title>
<script>
  // Define o tema antes de pintar a página, para não piscar
  (function () {
    var t = null;
    try { t = localStorage.getItem('betterai-docs-theme'); } catch (e) {}
    if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.dataset.theme = t;
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ---------- Tokens ---------- */
:root {
  --font-head: "Geist", "Inter", system-ui, sans-serif;
  --font-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "Cascadia Code", Consolas, monospace;
  --top: 97px; /* altura do cabeçalho; o script mede e atualiza */

  --bg: #ffffff;
  --ink: #030710;
  --ink-2: #3f3f40;
  --ink-3: #707071;
  --ink-4: #9f9fa0;
  --line: rgba(11, 12, 14, .1);
  --line-soft: #eeeeef;
  --fill: #f3f3f4;
  --fill-soft: rgba(11, 12, 14, .035);
  --primary: #161f34;
  --primary-fill: rgba(22, 31, 52, .09);
  --accent: #4b61d1;
  --cta: #4b61d1;
  --cta-hover: #3d51ba;

  --code-bg: #ffffff;
  --code-ink: #4c4f69;
  --t-c: #8c8fa1;
  --t-s: #40a02b;
  --t-k: #8839ef;
  --t-n: #fe640b;
  --t-f: #1e66f5;

  --note-bg: #f4f4f5;   --note-bd: #dedee2;   --note-ic: #707071;
  --info-bg: #ebf1ff;   --info-bd: #b6c8f7;   --info-ic: #3552c8;
  --tip-bg: #e8f6ec;    --tip-bd: #a5d8b6;    --tip-ic: #1d7a48;
  --warn-bg: #fff5dd;   --warn-bd: #ecd08a;   --warn-ic: #96600b;
  --danger-bg: #ffecec; --danger-bd: #f3b4b1; --danger-ic: #b9362e;

  --shadow-pop: 0 24px 60px -20px rgba(3, 7, 16, .3), 0 2px 8px rgba(3, 7, 16, .06);
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bg: #030710;
  --ink: #eceef3;
  --ink-2: #c5c7ce;
  --ink-3: #9193a0;
  --ink-4: #6d6f7c;
  --line: rgba(255, 255, 255, .1);
  --line-soft: rgba(255, 255, 255, .07);
  --fill: rgba(255, 255, 255, .05);
  --fill-soft: rgba(255, 255, 255, .05);
  --primary: #eceef3;
  --primary-fill: rgba(255, 255, 255, .09);
  --accent: #93a4ff;

  --code-bg: #0a0e1a;
  --code-ink: #cdd6f4;
  --t-c: #8a90ad;
  --t-s: #a6e3a1;
  --t-k: #cba6f7;
  --t-n: #fab387;
  --t-f: #89b4fa;

  --note-bg: rgba(255, 255, 255, .05);    --note-bd: rgba(255, 255, 255, .12);    --note-ic: #9193a0;
  --info-bg: rgba(75, 97, 209, .16);      --info-bd: rgba(120, 140, 240, .4);     --info-ic: #9fb0ff;
  --tip-bg: rgba(46, 160, 98, .15);       --tip-bd: rgba(80, 190, 130, .38);      --tip-ic: #7fdcaa;
  --warn-bg: rgba(214, 150, 30, .14);     --warn-bd: rgba(230, 175, 70, .38);     --warn-ic: #f0c577;
  --danger-bg: rgba(220, 70, 60, .15);    --danger-bd: rgba(240, 110, 100, .4);   --danger-ic: #ff9e97;

  --shadow-pop: 0 24px 60px -20px rgba(0, 0, 0, .8), 0 2px 8px rgba(0, 0, 0, .5);
  color-scheme: dark;
}

/* ---------- Base ---------- */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-padding-top: calc(var(--top) + 24px); }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 1rem/1.75 var(--font-body); -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
[hidden] { display: none !important; }
svg.ico { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
kbd { font: 500 .75rem/1 var(--font-body); color: var(--ink-3); }
.skip { position: absolute; left: 12px; top: -80px; z-index: 100; background: var(--ink); color: var(--bg); padding: 10px 14px; border-radius: 8px; }
.skip:focus { top: 10px; }

/* ---------- Cabeçalho ---------- */
.header { position: sticky; top: 0; z-index: 40; background: var(--bg); }
.banner { position: relative; display: flex; align-items: center; justify-content: center; min-height: 40px; padding: 6px 48px; background: var(--cta); color: #fff; font-size: .875rem; line-height: 1.4; text-align: center; }
.banner button { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); width: 28px; height: 28px; display: grid; place-items: center; border-radius: 8px; color: #fff; }
.banner button:hover { background: rgba(255, 255, 255, .18); }
.bar { max-width: 92rem; margin: 0 auto; padding: 0 2rem 0 2.25rem; }
.row1 { display: flex; align-items: center; gap: 16px; height: 56px; }
.brand { display: flex; align-items: center; gap: 9px; text-decoration: none; flex: 1 1 0; min-width: 0; }
.brand img { width: 26px; height: 27px; object-fit: contain; }
.brand-mark { width: 24px; height: 24px; border-radius: 8px; background: linear-gradient(150deg, #3fc1f5, #4b61d1 45%, #c57be8 75%, #ff7b72); }
.brand-name { font: 600 1.125rem/1 var(--font-head); letter-spacing: -.02em; }
.brand-sub { font: 500 1.125rem/1 var(--font-head); letter-spacing: -.02em; color: var(--ink-3); }
.search-trigger { flex: 0 1 24rem; min-width: 0; display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 12px 0 14px; border-radius: 999px; background: var(--fill-soft); color: var(--ink-3); font-size: .875rem; text-align: left; }
.search-trigger:hover { box-shadow: inset 0 0 0 1px var(--line); }
.search-trigger span { flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.actions { flex: 1 1 0; display: flex; align-items: center; justify-content: flex-end; gap: 8px; }
.btn-soft, .btn-cta { display: inline-flex; align-items: center; gap: 7px; height: 36px; padding: 0 12px; border-radius: 12px; font-size: .875rem; font-weight: 500; text-decoration: none; white-space: nowrap; }
.btn-soft { background: var(--fill-soft); color: var(--ink); }
.btn-soft:hover { box-shadow: inset 0 0 0 1px var(--line); }
.btn-cta { background: var(--cta); color: #fff; padding-right: 9px; }
.btn-cta:hover { background: var(--cta-hover); }
.icon-btn { width: 32px; height: 32px; display: inline-grid; place-items: center; border-radius: 10px; border: 1px solid var(--line); color: var(--ink-2); }
.icon-btn:hover { background: var(--fill-soft); }
.tabs-row { display: flex; gap: 24px; height: 40px; border-bottom: 1px solid var(--line-soft); font-size: .875rem; overflow-x: auto; scrollbar-width: none; }
.tabs-row::-webkit-scrollbar { display: none; }
.tab { position: relative; display: flex; align-items: center; color: var(--ink-2); text-decoration: none; white-space: nowrap; font-weight: 500; }
.tab:hover { color: var(--ink); }
.tab[aria-current="page"] { color: var(--ink); font-weight: 600; }
.tab[aria-current="page"]::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 1.5px; background: var(--primary); }
.tab:hover:not([aria-current])::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 1.5px; background: var(--line); }
.header-line { border-bottom: 1px solid var(--line-soft); margin-top: -1px; }
.subbar { display: none; align-items: center; gap: 10px; height: 44px; font-size: .875rem; color: var(--ink-3); border-bottom: 1px solid var(--line-soft); }
.subbar button { display: inline-flex; align-items: center; gap: 8px; color: var(--ink-2); }
.subbar .here { color: var(--ink); font-weight: 500; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.subbar svg { width: 14px; height: 14px; }
.only-mobile { display: none; }

/* ---------- Estrutura ---------- */
.shell { max-width: 92rem; margin: 0 auto; display: flex; align-items: flex-start; }
.side-wrap { position: sticky; top: var(--top); flex: none; width: 19.25rem; height: calc(100vh - var(--top)); padding: 28px 20px 40px 20px; overflow-y: auto; border-right: 1px solid var(--line-soft); scrollbar-width: thin; scrollbar-color: var(--line) transparent; background: var(--bg); }
.main { flex: 1; min-width: 0; }
.main-row { display: flex; align-items: flex-start; padding-top: 40px; }
.article { flex: 1; min-width: 0; max-width: 46rem; margin: 0 auto; padding: 0 2.5rem; }
.toc { position: sticky; top: calc(var(--top) + 40px); flex: none; width: 19rem; max-height: calc(100vh - var(--top) - 56px); overflow-y: auto; padding: 0 2rem 0 2.5rem; scrollbar-width: none; }
.no-toc .toc { visibility: hidden; }
.scrim { display: none; }

/* ---------- Menu lateral ---------- */
.side-areas { display: none; }
.side-link { display: flex; align-items: center; gap: 10px; width: 100%; padding: 6px 12px 6px 16px; border-radius: 12px; font-size: .875rem; line-height: 1.25rem; color: var(--ink-2); text-decoration: none; text-align: left; overflow-wrap: anywhere; }
.side-link:hover { background: var(--fill-soft); color: var(--ink); }
.side-link[aria-current="page"] { background: var(--primary-fill); color: var(--primary); font-weight: 500; }
.side-link .chev { margin-left: auto; width: 14px; height: 14px; color: var(--ink-4); transition: transform .15s ease; }
.side-folder[aria-expanded="true"] .chev { transform: rotate(90deg); }
.side-group { margin-top: 26px; }
.side-title { margin: 0 0 8px; padding-left: 16px; font-size: .75rem; line-height: 1rem; font-weight: 600; color: var(--ink); }
.side ul { list-style: none; margin: 0; padding: 0; }
.side li + li { margin-top: 2px; }
.side-sub { margin: 2px 0 4px 16px !important; padding-left: 4px !important; border-left: 1px solid var(--line-soft); }
.badge { margin-left: auto; flex: none; font-size: .65rem; line-height: 1; font-weight: 500; padding: 3px 6px; border-radius: 6px; background: var(--primary-fill); color: var(--primary); }

/* ---------- Página ---------- */
.eyebrow { font-size: .875rem; font-weight: 600; color: var(--accent); margin-bottom: 10px; }
.title-row { display: flex; align-items: flex-start; gap: 16px; }
.page-title { flex: 1; min-width: 0; margin: 0; font: 600 2.25rem/2.5rem var(--font-head); letter-spacing: -.025em; overflow-wrap: anywhere; }
.page-title:focus { outline: none; }
.lead { margin: 12px 0 0; font-size: 1.125rem; line-height: 1.75rem; color: var(--ink-3); text-wrap: pretty; }
.copy-page { position: relative; flex: none; display: flex; margin-top: 4px; border: 1px solid var(--line); border-radius: 12px; font-size: .875rem; font-weight: 500; color: var(--ink-2); }
.copy-page > button { display: inline-flex; align-items: center; gap: 8px; height: 32px; }
.cp-main { padding: 0 12px; border-radius: 11px 0 0 11px; }
.cp-caret { padding: 0 8px; border-left: 1px solid var(--line); border-radius: 0 11px 11px 0; }
.copy-page > button:hover { background: var(--fill-soft); color: var(--ink); }
.cp-menu { position: absolute; z-index: 5; right: 0; top: calc(100% + 6px); min-width: 15rem; padding: 6px; border: 1px solid var(--line); border-radius: 14px; background: var(--bg); box-shadow: var(--shadow-pop); }
.cp-menu button { display: flex; flex-direction: column; width: 100%; padding: 8px 10px; border-radius: 9px; text-align: left; line-height: 1.35; }
.cp-menu button:hover { background: var(--fill-soft); }
.cp-menu small { font-weight: 400; color: var(--ink-3); font-size: .8125rem; }

.prose { margin: 32px 0 56px; }
.prose > :first-child { margin-top: 0; }
.prose h2 { position: relative; margin: 36px 0 18px; font: 600 1.5rem/2rem var(--font-head); letter-spacing: -.025em; }
.prose h3 { position: relative; margin: 32px 0 14px; font: 600 1.25rem/1.75rem var(--font-head); letter-spacing: -.025em; }
.anchor { position: absolute; left: -1.5rem; top: 0; width: 1.5rem; color: var(--ink-4); text-decoration: none; opacity: 0; font-weight: 400; }
.prose h2:hover .anchor, .prose h3:hover .anchor, .anchor:focus-visible { opacity: 1; }
.prose p { margin: 0 0 20px; text-wrap: pretty; }
.prose ul, .prose ol { margin: 0 0 20px; padding-left: 1.5rem; }
.prose li { margin: 8px 0; padding-left: 4px; }
.prose li::marker { color: var(--ink-4); }
.prose strong { font-weight: 600; }
.prose p a, .prose li a, .prose td a { font-weight: 500; text-decoration: underline; text-decoration-color: var(--accent); text-decoration-thickness: 1px; text-underline-offset: 4px; }
.prose p a:hover, .prose li a:hover, .prose td a:hover { text-decoration-thickness: 2px; }
.prose :not(pre) > code { font: 400 .875em var(--font-mono); padding: 2px 6px; border-radius: 6px; background: var(--fill); color: var(--ink-2); overflow-wrap: break-word; }
.prose td code { white-space: nowrap; }
.prose img, .prose video { display: block; max-width: 100%; }

.table-wrap { margin: 20px 0 28px; overflow-x: auto; }
.table-wrap table { width: 100%; border-collapse: collapse; font-size: .875rem; line-height: 1.5; }
.table-wrap th { text-align: left; font-weight: 600; padding: 0 12px 8px 0; border-bottom: 1px solid var(--line); white-space: nowrap; }
.table-wrap td { padding: 9px 12px 9px 0; border-bottom: 1px solid var(--line-soft); vertical-align: top; }

.code { position: relative; margin: 20px 0 32px; border: 1px solid var(--line); border-radius: 16px; background: var(--fill); padding: 2px; }
.code.plain { padding: 0; background: var(--code-bg); }
.code-head { display: flex; align-items: center; gap: 14px; min-height: 36px; padding: 0 6px 0 12px; font-size: .75rem; color: var(--ink-3); }
.code-title { font-weight: 500; color: var(--ink-2); }
.code-tabs { display: flex; gap: 14px; overflow-x: auto; scrollbar-width: none; }
.code-tab { padding: 8px 0 6px; font-weight: 500; color: var(--ink-3); border-bottom: 1.5px solid transparent; white-space: nowrap; }
.code-tab:hover { color: var(--ink); }
.code-tab[aria-selected="true"] { color: var(--primary); border-bottom-color: var(--primary); }
.code-body { position: relative; border-radius: 14px; background: var(--code-bg); overflow: hidden; }
.code.plain .code-body { border-radius: 15px; }
.code pre { margin: 0; padding: 14px 16px; overflow-x: auto; font: 400 .875rem/1.5rem var(--font-mono); color: var(--code-ink); tab-size: 4; }
.code code { font: inherit; }
.copy { flex: none; margin-left: auto; width: 28px; height: 28px; display: grid; place-items: center; border-radius: 8px; color: var(--ink-4); }
.copy:hover { color: var(--ink); background: var(--fill-soft); }
.copy.floating { position: absolute; top: 8px; right: 8px; background: var(--code-bg); }
.t-c { color: var(--t-c); font-style: italic; }
.t-s { color: var(--t-s); }
.t-k { color: var(--t-k); }
.t-n { color: var(--t-n); }
.t-f { color: var(--t-f); }

.callout { display: flex; gap: 12px; margin: 16px 0 24px; padding: 16px 20px; border-radius: 16px; border: 1px solid var(--info-bd); background: var(--info-bg); font-size: .9375rem; line-height: 1.6; }
.callout > svg { width: 18px; height: 18px; margin-top: 3px; color: var(--info-ic); }
.callout p { margin: 0; }
.callout[data-kind="tip"] { border-color: var(--tip-bd); background: var(--tip-bg); }
.callout[data-kind="tip"] > svg { color: var(--tip-ic); }
.callout[data-kind="warn"] { border-color: var(--warn-bd); background: var(--warn-bg); }
.callout[data-kind="warn"] > svg { color: var(--warn-ic); }
.callout[data-kind="danger"] { border-color: var(--danger-bd); background: var(--danger-bg); }
.callout[data-kind="danger"] > svg { color: var(--danger-ic); }
.callout[data-kind="note"] { border-color: var(--note-bd); background: var(--note-bg); }
.callout[data-kind="note"] > svg { color: var(--note-ic); }

.cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; margin: 20px 0 28px; }
.cards.one { grid-template-columns: 1fr; }
.card { position: relative; display: flex; flex-direction: column; padding: 20px 24px; border: 1px solid var(--line); border-radius: 16px; text-decoration: none; background: var(--bg); }
.card:hover { border-color: var(--accent); }
.card-icon { color: var(--ink); margin-bottom: 14px; }
.card-icon svg { width: 22px; height: 22px; stroke-width: 1.6; }
.card-title { font: 600 1rem/1.5rem var(--font-head); letter-spacing: -.01em; }
.card-text { margin-top: 2px; font-size: .9375rem; line-height: 1.5rem; color: var(--ink-3); }
.card.row { flex-direction: row; align-items: flex-start; gap: 16px; padding: 18px 44px 18px 22px; }
.card.row .card-icon { margin: 2px 0 0; }
.card.row .card-title, .card.row .card-text { display: block; }
.card-go { position: absolute; top: 18px; right: 18px; width: 14px; height: 14px; color: var(--ink-4); }
.card:hover .card-go { color: var(--accent); }

.endpoint { display: flex; align-items: center; gap: 12px; margin: 16px 0; padding: 10px 14px; border: 1px solid var(--line); border-radius: 12px; font: 400 .875rem var(--font-mono); overflow-x: auto; }
.method { flex: none; font: 600 .6875rem/1 var(--font-body); padding: 5px 8px; border-radius: 6px; background: var(--info-bg); color: var(--info-ic); }
.method[data-m="GET"] { background: var(--tip-bg); color: var(--tip-ic); }

.prose details, .toc-inline { margin: 0 0 12px; border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
.prose summary, .toc-inline summary { cursor: pointer; padding: 14px 20px; font-weight: 500; font-size: .9375rem; }
.prose details[open] summary { border-bottom: 1px solid var(--line-soft); }
.prose details .code { margin: 0; border: 0; border-radius: 0; padding: 0; }
.prose details .code-head { padding-left: 20px; }
.prose details .code-body { border-radius: 0; }
.prose details pre { padding-left: 20px; }

.frame { margin: 20px 0 32px; padding: 8px; border: 1px solid var(--line); border-radius: 18px; background: var(--fill); }
.frame video, .frame img { width: 100%; border-radius: 11px; }
.frame video { aspect-ratio: 16 / 9; background: #0a0e1a; }
.frame figcaption, .frame-missing { padding: 10px 8px 4px; font-size: .875rem; color: var(--ink-3); text-align: center; }
.frame-missing { aspect-ratio: 16 / 9; display: grid; place-content: center; gap: 4px; }
figure.frame { margin-inline: 0; }

.toc-inline { display: none; margin: 24px 0 0; }
.toc-inline ul { list-style: none; margin: 0; padding: 0 20px 14px; font-size: .875rem; }
.toc-inline a { display: block; padding: 4px 0; color: var(--ink-2); text-decoration: none; }
.toc-inline .lvl-3 { padding-left: 14px; }

/* ---------- Página vazia ---------- */
.empty { margin-top: 8px; padding: 44px 28px; text-align: center; border: 1px dashed var(--line); border-radius: 16px; }
.empty > svg { width: 30px; height: 30px; color: var(--ink-4); }
.empty-title { font: 600 1.25rem/1.5 var(--font-head); letter-spacing: -.02em; margin: 12px 0 4px; }
.empty p { color: var(--ink-3); margin: 0 auto 18px; max-width: 32rem; }
.empty .btn-cta { padding-right: 14px; }

/* ---------- Fim da página ---------- */
.feedback { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; font-size: .875rem; color: var(--ink-3); }
.feedback .q { color: var(--ink-2); }
.fb-btn { display: inline-flex; align-items: center; gap: 7px; height: 32px; padding: 0 12px; border: 1px solid var(--line); border-radius: 10px; color: var(--ink-2); font-weight: 500; }
.fb-btn:hover { background: var(--fill-soft); color: var(--ink); }
.feedback .edit { margin-left: auto; display: inline-flex; align-items: center; gap: 7px; text-decoration: none; }
.feedback .edit:hover { color: var(--ink); }
.source { margin: 12px 0 0; font-size: .8125rem; color: var(--ink-4); }
.source code { font: 400 .8125rem var(--font-mono); overflow-wrap: anywhere; }
.pager { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin: 32px 0 64px; }
.pager-link { display: flex; align-items: center; gap: 12px; min-width: 0; padding: 12px 16px; border: 1px solid var(--line); border-radius: 12px; text-decoration: none; }
.pager-link:hover { border-color: var(--accent); }
.pager-link > svg { color: var(--ink-4); }
.pager-link div { min-width: 0; }
.pager-link small { display: block; font-size: .75rem; line-height: 1.2; color: var(--ink-3); }
.pager-link span { display: block; font-weight: 500; font-size: .9375rem; line-height: 1.5; overflow-wrap: anywhere; }
.pager-link.prev svg { transform: rotate(180deg); }
.pager-link.next { grid-column: 2; justify-content: flex-end; text-align: right; }

.site-foot { border-top: 1px solid var(--line-soft); padding: 40px 2.5rem 56px; display: flex; flex-wrap: wrap; gap: 32px 64px; font-size: .875rem; color: var(--ink-3); }
.foot-brand { flex: 1 1 14rem; }
.foot-brand .brand { margin-bottom: 10px; }
.foot-brand p { margin: 0; max-width: 20rem; line-height: 1.5; }
.foot-col h2 { margin: 0 0 10px; font: 600 .875rem/1.4 var(--font-body); color: var(--ink); }
.foot-col a { display: block; padding: 4px 0; text-decoration: none; }

<template data-page="getting-started/quickstart"
  data-lead="Do clone ao primeiro GET /health: ambiente virtual, dependências, variáveis de ambiente e os dois serviços rodando na sua máquina.">
  <h2>1. Atualize o projeto</h2>
  <p>Comece na branch certa e com o código em dia. Crie a sua branch a partir de <code>production</code>.</p>
  <pre data-lang="bash"><code>
git checkout production
git pull
git checkout -b nome-da-sua-branch
</code></pre>

  <h2>2. Crie o ambiente virtual</h2>
  <div class="callout" data-kind="info"><p><strong>Requisito.</strong> Use a versão do Python fixada em <code>.python-version</code>. Outras versões podem instalar, mas não são testadas.</p></div>
  <pre data-lang="bash"><code>
python -m venv .venv
</code></pre>

  <h2>3. Ative o ambiente virtual</h2>
  <div class="tabs">
    <div data-tab="PowerShell">
      <pre data-lang="bash"><code>
.\.venv\Scripts\Activate.ps1
</code></pre>
    </div>
    <div data-tab="CMD">
      <pre data-lang="bash"><code>
.venv\Scripts\activate.bat
</code></pre>
    </div>
    <div data-tab="macOS e Linux">
      <pre data-lang="bash"><code>
source .venv/bin/activate
</code></pre>
    </div>
  </div>
  <p>Depois de ativar, o prompt do terminal passa a começar com <code>(.venv)</code>.</p>

  <h2>4. Instale as dependências</h2>
  <p>O <code>uv</code> é a fonte da verdade para as dependências. Ele lê o <code>pyproject.toml</code> e o <code>uv.lock</code>.</p>
  <pre data-lang="bash"><code>
uv sync
</code></pre>

  <h2>5. Configure as variáveis de ambiente</h2>
  <p>Crie um arquivo <code>.env</code> na raiz do projeto. Estas são as variáveis que mais importam para subir a API:</p>
  <table>
    <thead><tr><th>Variável</th><th>Descrição</th></tr></thead>
    <tbody>
      <tr><td><code>BETTERAI_API_KEY</code></td><td>Chave interna usada no cabeçalho <code>X-API-Key</code></td></tr>
      <tr><td><code>OPENAI_API_KEY</code></td><td>Chave de API da OpenAI</td></tr>
      <tr><td><code>ANTHROPIC_API_KEY</code></td><td>Chave de API da Anthropic</td></tr>
      <tr><td><code>GEMINI_API_KEY</code></td><td>Chave de API do Google Gemini</td></tr>
      <tr><td><code>PINECONE_API_KEY</code></td><td>Chave de API do Pinecone</td></tr>
      <tr><td><code>NOSQL_BACKEND</code></td><td>Backend NoSQL: <code>local</code> ou remoto</td></tr>
      <tr><td><code>LOCAL</code></td><td>Execução local. Com <code>true</code>, a API não exige chave</td></tr>
    </tbody>
  </table>
  <details>
    <summary>Ver o modelo completo do .env</summary>
    <pre data-lang="env" data-title=".env"><code>
# BetterAI
BETTERAI_API_KEY=********************

# LLMs
OPENAI_API_KEY=********************
OPENAI_EMBEDDING_MODEL=text-embedding-3-large
GEMINI_API_KEY=********************
GROQ_API_KEY=********************
ANTHROPIC_API_KEY=********************

# Pinecone
PINECONE_API_KEY=********************
PINECONE_ENVIRONMENT=us-east-1
PINECONE_NAMESPACE=knowledge_base

# Regras de tracing
SHOW_INFO_LOGS=false
SAVE_LOGS=false
LOCAL=false
</code></pre>
  </details>
  <div class="callout" data-kind="warn"><p><strong>Só em desenvolvimento.</strong> <code>LOCAL=true</code> desliga a autenticação por chave em todas as rotas. Nunca use em homologação ou produção.</p></div>

  <h2>6. Execute a aplicação</h2>
  <p>O projeto tem dois serviços independentes. Rode cada um no seu terminal.</p>
  <table>
    <thead><tr><th>Serviço</th><th>Comando</th><th>Porta</th></tr></thead>
    <tbody>
      <tr><td>API (FastAPI)</td><td><code>uvicorn web_services:app --reload</code></td><td><code>8000</code></td></tr>
      <tr><td>Interface (Streamlit)</td><td><code>streamlit run web_app.py</code></td><td><code>8501</code></td></tr>
    </tbody>
  </table>
  <h3>API</h3>
  <pre data-lang="bash"><code>
uvicorn web_services:app --reload
</code></pre>
  <pre data-lang="output" data-title="Saída"><code>
INFO:     Uvicorn running on http://127.0.0.1:8000 (Press CTRL+C to quit)
INFO:     Router included: /agents
INFO:     Router included: /davinci
INFO:     Router included: /deep-research
INFO:     Router included: /parse-content
INFO:     Router included: /vector-store
INFO:     BetterAI Web Service Network initialized successfully.
INFO:     Application startup complete.
</code></pre>
  <p>Confirme que a API respondeu antes de seguir:</p>
  <pre data-lang="bash"><code>
curl -X GET "http://127.0.0.1:8000/health"
</code></pre>
  <div class="callout" data-kind="tip"><p>Se o <code>/health</code> respondeu, a documentação interativa está em <code>http://localhost:8000/docs</code>.</p></div>
  <h3>Interface Streamlit</h3>
  <pre data-lang="bash"><code>
streamlit run web_app.py
</code></pre>
  <p>A interface abre em <code>http://localhost:8501</code>, com o <a href="#/streamlit-applications/acquarello">Acquarello</a> e o <a href="#/streamlit-applications/content-generator">Content Generator</a>.</p>

  <h2>Resolução de problemas</h2>
  <table>
    <thead><tr><th>Sintoma</th><th>Causa provável</th><th>O que fazer</th></tr></thead>
    <tbody>
      <tr><td><code>ModuleNotFoundError</code> ao iniciar</td><td>Ambiente virtual desativado ou dependências ausentes</td><td>Reative o <code>.venv</code> e rode <code>uv sync</code></td></tr>
      <tr><td>Erro de autenticação nos provedores</td><td>Chave ausente ou inválida no <code>.env</code></td><td>Revise o passo 5</td></tr>
      <tr><td>Porta já em uso</td><td>Outra instância do serviço está ativa</td><td>Encerre o processo anterior ou use <code>--port</code></td></tr>
    </tbody>
  </table>

  <h2>Próximos passos</h2>
  <div class="cards">
    <a class="card" href="#/modules/agents/utils/model-gateway"><span class="card-icon" data-ico="boxes"></span><span class="card-title">Model Gateway</span><span class="card-text">Crie modelos e agentes de qualquer provedor pela mesma chamada.</span></a>
    <a class="card" href="#/modules/web-service-network/web-service-network-api"><span class="card-icon" data-ico="code"></span><span class="card-title">Web Service Network</span><span class="card-text">Autenticação, formato das respostas e endpoints da API.</span></a>
  </div>
</template>

<template data-page="modules/agents/utils/model-gateway"
  data-lead="Uma fábrica única para criar modelos e agentes Agno de qualquer provedor, com os parâmetros validados antes da chamada.">
  <p>A <code>ModelGateway</code> esconde as diferenças entre as APIs da Anthropic, do Google, da Groq e da OpenAI. Você informa o provedor e os parâmetros, e ela resolve a classe certa, confere os argumentos contra a assinatura real do construtor e devolve o modelo pronto.</p>
  <p>Ela cobre o seguinte:</p>
  <ul>
    <li><strong>Um ponto de entrada:</strong> o mesmo método cria modelos de qualquer provedor.</li>
    <li><strong>Apelidos de provedor:</strong> <code>anthropic</code> e <code>claude</code> levam ao mesmo lugar, assim como <code>google</code> e <code>gemini</code>.</li>
    <li><strong>Validação de parâmetros:</strong> argumentos que o modelo não aceita geram erro antes da chamada.</li>
    <li><strong>Agentes prontos:</strong> <code>create_agent</code> devolve um agente Agno já configurado.</li>
  </ul>
  <div class="callout" data-kind="info"><p>Todo código novo de agente deve criar modelos por aqui, em vez de importar os SDKs dos provedores diretamente.</p></div>

  <h2>Experimente</h2>
  <div class="tabs">
    <div data-tab="Anthropic">
      <pre data-lang="python"><code>
from src.agents.utils.model_gateway import ModelGateway

gateway = ModelGateway(strict_validation=True)

model = gateway.create_model(
    provider="anthropic",
    model_id="claude-sonnet-5-5",
    temperature=0.2,
)
</code></pre>
    </div>
    <div data-tab="Google">
      <pre data-lang="python"><code>
from src.agents.utils.model_gateway import ModelGateway

gateway = ModelGateway(strict_validation=True)

model = gateway.create_model(
    provider="google",
    model_id="gemini-2.5-flash",
    temperature=0.2,
)
</code></pre>
    </div>
    <div data-tab="OpenAI">
      <pre data-lang="python"><code>
from src.agents.utils.model_gateway import ModelGateway

gateway = ModelGateway(strict_validation=True)

# Um método por variante, sem informar o provider
model = gateway.openai_chat(model_id="gpt-4o-mini")
</code></pre>
    </div>
    <div data-tab="Groq">
      <pre data-lang="python"><code>
from src.agents.utils.model_gateway import ModelGateway

gateway = ModelGateway(strict_validation=True)

model = gateway.groq(model_id="llama-3.3-70b-versatile")
</code></pre>
    </div>
  </div>
  <div class="cards one">
    <a class="card row" href="#/getting-started/quickstart"><span class="card-icon" data-ico="bolt"></span><span><span class="card-title">Ainda não rodou o projeto?</span><span class="card-text" style="display:block">O Quickstart leva do clone ao primeiro request.</span></span></a>
  </div>

  <h2>Fluxo de execução</h2>
  <ol>
    <li>Instancie a <code>ModelGateway</code>, escolhendo se a validação é estrita.</li>
    <li>Chame <code>create_model</code> com o <code>provider</code> e, se quiser, o <code>model_id</code>.</li>
    <li>A classe normaliza o nome do provedor e resolve o construtor correspondente.</li>
    <li>Com validação estrita, cada parâmetro é conferido contra a assinatura do construtor.</li>
    <li>O modelo é criado e devolvido.</li>
  </ol>

  <h2>Métodos</h2>
  <table>
    <thead><tr><th>Método</th><th>Descrição</th></tr></thead>
    <tbody>
      <tr><td><code>supported_providers</code></td><td>Lista os provedores aceitos</td></tr>
      <tr><td><code>supported_parameters</code></td><td>Lista os parâmetros válidos para um modelo</td></tr>
      <tr><td><code>create_model</code></td><td>Cria uma instância do modelo escolhido</td></tr>
      <tr><td><code>create_agent</code></td><td>Cria um agente Agno já configurado com o modelo</td></tr>
      <tr><td><code>anthropic</code>, <code>google</code>, <code>groq</code></td><td>Atalhos por provedor</td></tr>
      <tr><td><code>openai_chat</code>, <code>openai_responses</code></td><td>Atalhos para as variantes da OpenAI</td></tr>
    </tbody>
  </table>

  <h2>Referência</h2>
  <h3>create_model</h3>
  <p>Cria e devolve uma instância do modelo do provedor informado.</p>
  <table>
    <thead><tr><th>Argumento</th><th>Tipo</th><th>Padrão</th><th>Descrição</th></tr></thead>
    <tbody>
      <tr><td><code>provider</code></td><td><code>str</code></td><td>obrigatório</td><td>Nome ou apelido do provedor, como <code>anthropic</code> ou <code>claude</code></td></tr>
      <tr><td><code>model_id</code></td><td><code>str | None</code></td><td><code>None</code></td><td>Identificador do modelo. Sem ele, vale o padrão do provedor</td></tr>
      <tr><td><code>openai_variant</code></td><td><code>str</code></td><td><code>"chat"</code></td><td>Variante da OpenAI: <code>chat</code>, <code>responses</code>, <code>open_responses</code> ou <code>like</code></td></tr>
      <tr><td><code>**kwargs</code></td><td><code>Any</code></td><td></td><td>Parâmetros repassados ao construtor do modelo</td></tr>
    </tbody>
  </table>
  <div class="callout" data-kind="danger"><p><strong>Levanta <code>ValueError</code></strong> quando o provedor não é reconhecido ou, com validação estrita, quando um parâmetro não existe no construtor do modelo.</p></div>

  <h3>create_agent</h3>
  <p>Chama <code>create_model</code> por dentro e devolve um <code>agno.agent.Agent</code> configurado. Aceita os mesmos argumentos de modelo, mais os do agente.</p>
  <pre data-lang="python"><code>
agent = gateway.create_agent(
    provider="google",
    model_id="gemini-2.5-flash",
    instructions="Responda em português e cite as fontes.",
    markdown=True,
)

agent.print_response("Resuma o catálogo de produtos.")
</code></pre>

  <h2>Variáveis de ambiente</h2>
  <p>O módulo chama <code>load_dotenv()</code> ao ser importado. A classe não lê variáveis diretamente, mas os modelos dependem das chaves de cada provedor:</p>
  <ul>
    <li><code>OPENAI_API_KEY</code> para os modelos da OpenAI</li>
    <li><code>ANTHROPIC_API_KEY</code> para os modelos da Anthropic</li>
    <li><code>GEMINI_API_KEY</code> para os modelos do Google</li>
  </ul>
</template>

<template data-page="modules/web-service-network/web-service-network-api"
  data-lead="A API FastAPI que expõe os serviços de IA. Autenticação, formato das respostas e os endpoints disponíveis.">
  <h2>Autenticação</h2>
  <p>Toda rota protegida exige o cabeçalho <code>X-API-Key</code> com o valor de <code>BETTERAI_API_KEY</code>.</p>
  <pre data-lang="bash"><code>
curl "http://localhost:8000/health-authorization" \
  -H "X-API-Key: $BETTERAI_API_KEY"
</code></pre>
  <div class="callout" data-kind="warn"><p>Com <code>LOCAL=true</code>, a verificação da chave é ignorada. Use só na sua máquina.</p></div>

  <h2>Formato das respostas</h2>
  <p>Toda resposta segue o mesmo envelope, seja qual for o serviço.</p>
  <pre data-lang="json"><code>
{

      <pre data-lang="python"><code>service = ${cls}(local=True)
result = service.run(payload)

print(result["status"])  # completed</code></pre>
      <h2>Pontos de atenção</h2>
      <ul>
        <li>As credenciais vêm do arquivo <code>.env</code>.</li>
        <li>Toda execução gera um registro de tracing com <code>log_id</code>.</li>
      </ul>`;
  }

  function emptyBody(p, next) {
    return `
      <div class="empty">
        ${ico('blank')}
        <p class="empty-title">Esta página ainda está em branco</p>
        <p>O arquivo <code>${esc(p.src)}</code> existe, mas não tem conteúdo. Quando ele for preenchido, o texto aparece aqui.</p>
        ${next ? `<a class="btn-cta" href="#/${next.id}">Ir para ${esc(next.t)}</a>` : ''}
      </div>`;
  }

  /* ---------- Renderização ---------- */
  const pageEl = $('#page'), tocEl = $('#toc');
  let headings = [], currentId = null;

  function render(p) {
    currentId = p.id;
    const areaId = p.home ? 'home' : p.area.id;
    document.title = p.home ? 'BetterAI Docs' : `${p.overview ? p.t : p.t + ' | ' + p.area.t} | BetterAI Docs`;
    const i = PAGES.indexOf(p), prev = PAGES[i - 1], next = PAGES[i + 1];
    const tpl = $(`template[data-page="${p.id}"]`);

    const body = p.home ? homeBody() : p.overview ? overviewBody(p.area) : p.empty ? emptyBody(p, next) : tpl ? tpl.innerHTML : sampleBody(p);
    const lead = p.home ? 'Múltiplos modelos de IA, um único back-end unificado.' : p.overview ? p.area.about : p.empty ? '' : tpl ? tpl.dataset.lead : `Página de exemplo para ${p.t}, usada para validar o layout.`;
    const eyebrow = p.home || p.overview ? '' : (p.path.length ? p.path.join(' / ') : p.area.loose);
    const label = n => n.overview ? `${n.t}: visão geral` : n.home ? 'Visão geral' : n.t;

    pageEl.innerHTML = `
      <header>
        ${eyebrow ? `<div class="eyebrow">${esc(eyebrow)}</div>` : ''}
        <div class="title-row">
          <h1 class="page-title" tabindex="-1">${esc(p.t)}</h1>
          <div class="copy-page">
            <button class="cp-main" type="button">${ico('copy')}<span>Copiar página</span></button>
            <button class="cp-caret" type="button" aria-label="Mais opções" aria-expanded="false">${ico('down')}</button>
            <div class="cp-menu" hidden>
              <button type="button" data-fake>Copiar como Markdown<small>Para colar em um chat de IA</small></button>
              <button type="button" data-fake>Ver arquivo fonte<small>${esc(p.src || 'doc/README.md')}</small></button>
            </div>
          </div>
        </div>
        ${lead ? `<p class="lead">${esc(lead)}</p>` : ''}
        <details class="toc-inline"><summary>Nesta página</summary><ul></ul></details>
      </header>
      <div class="prose">${body}</div>
      <div class="feedback">
        <span class="q">Esta página foi útil?</span>
        <button class="fb-btn" type="button">${ico('up')}Sim</button>
        <button class="fb-btn" type="button">${ico('dn')}Não</button>
        <a class="edit" href="#" data-fake>${ico('edit')}Editar no GitHub</a>
      </div>
      ${p.src ? `<p class="source">Fonte: <code>${esc(p.src)}</code></p>` : ''}
      <nav class="pager" aria-label="Páginas vizinhas">
        ${prev ? `<a class="pager-link prev" href="#/${prev.home ? '' : prev.id}">${ico('chevron')}<div><small>Anterior</small><span>${esc(label(prev))}</span></div></a>` : ''}
        ${next ? `<a class="pager-link next" href="#/${next.id}"><div><small>Próxima</small><span>${esc(label(next))}</span></div>${ico('chevron')}</a>` : ''}
      </nav>`;
    enhance($('.prose', pageEl));
    renderNav(areaId);
    markActive(p, areaId);
    buildToc(p);
    $('#crumbArea').textContent = p.home ? 'BetterAI' : p.area.t;
    $('#crumbPage').textContent = p.home || p.overview ? 'Visão geral' : p.t;
  }

  function copyButton(getText, cls = '') {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'copy ' + cls; b.setAttribute('aria-label', 'Copiar código'); b.innerHTML = ico('copy');
    b.addEventListener('click', async () => {
      try { await navigator.clipboard.writeText(getText()); } catch (e) {}
      b.innerHTML = ico('check');
      setTimeout(() => { b.innerHTML = ico('copy'); }, 1600);
    });
    return b;
  }
  function prep(pre) {
    const code = $('code', pre);
    pre.raw = code.textContent.replace(/^\n/, '').replace(/\s+$/, '');
    code.innerHTML = highlight(pre.raw, pre.dataset.lang || '');
  }

  function enhance(prose) {
    $$('[data-ico]', prose).forEach(s => { s.innerHTML = ico(s.dataset.ico); });
    $$('.card.row', prose).forEach(c => { if (!$('.card-go', c)) c.insertAdjacentHTML('beforeend', ico('go', 'card-go')); });
    $$('table', prose).forEach(t => { const w = document.createElement('div'); w.className = 'table-wrap'; t.replaceWith(w); w.append(t); });

    // grupos de código com abas
    $$('.tabs', prose).forEach(tabs => {
      const panels = $$(':scope > [data-tab]', tabs);
      const box = document.createElement('div'); box.className = 'code';
      const head = document.createElement('div'); head.className = 'code-head';
      const list = document.createElement('div'); list.className = 'code-tabs'; list.setAttribute('role', 'tablist');
      const body = document.createElement('div'); body.className = 'code-body';
      let active = null;
      panels.forEach((panel, i) => {
        const pre = $('pre', panel); prep(pre); pre.hidden = i > 0;
        if (i === 0) active = pre;
        const b = document.createElement('button');
        b.type = 'button'; b.className = 'code-tab'; b.textContent = panel.dataset.tab;
        b.setAttribute('role', 'tab'); b.setAttribute('aria-selected', i === 0);
        b.addEventListener('click', () => {
          $$('.code-tab', list).forEach(x => x.setAttribute('aria-selected', x === b));
          $$('pre', body).forEach(x => { x.hidden = x !== pre; });
          active = pre;
        });
        list.append(b); body.append(pre);
      });
      head.append(list, copyButton(() => active.raw));
      box.append(head, body);
      tabs.replaceWith(box);
    });
    // blocos de código soltos
    $$('pre', prose).forEach(pre => {
      if (pre.closest('.code')) return;
      prep(pre);
      const box = document.createElement('div');
      const body = document.createElement('div'); body.className = 'code-body';
      const title = pre.dataset.title;
      pre.replaceWith(box);
      if (title) {
        box.className = 'code';
        const head = document.createElement('div'); head.className = 'code-head';
        head.innerHTML = `<span class="code-title">${esc(title)}</span>`;
        head.append(copyButton(() => pre.raw));
        body.append(pre); box.append(head, body);
      } else {
        box.className = 'code plain';
        body.append(pre, copyButton(() => pre.raw, 'floating')); box.append(body);
      }
    });
    $$('.callout', prose).forEach(c => c.insertAdjacentHTML('afterbegin', ico(ICON[c.dataset.kind] ? c.dataset.kind : 'info')));
    $$('.frame video', prose).forEach(v => v.addEventListener('error', () => { v.hidden = true; v.nextElementSibling.hidden = false; }));
    const seen = new Set();
    $$('h2, h3', prose).forEach(h => {
      let id = slug(h.textContent), n = 2;
      while (seen.has(id)) id = slug(h.textContent) + '-' + n++;
      seen.add(id);
      h.id = id;
      h.insertAdjacentHTML('afterbegin', `<a class="anchor" href="#/${currentId}::${id}" aria-label="Link para esta seção">#</a>`);
    });
  }

  function buildToc(p) {
    headings = $$('.prose h2, .prose h3', pageEl);
    const has = headings.length > 1;
    document.body.classList.toggle('no-toc', !has);
    const items = headings.map(h => `<li><a class="lvl-${h.tagName[1]}" href="#/${p.id}::${h.id}" data-h="${h.id}">${esc(h.textContent.replace(/^#/, ''))}</a></li>`).join('');
    tocEl.innerHTML = has ? `<p class="toc-title">${ico('list')}Nesta página</p><ul>${items}</ul>` : '';
    const inline = $('.toc-inline', pageEl);
    if (has) $('ul', inline).innerHTML = items; else inline.remove();
    spy();
  }

  /* ---------- Rolagem: seção ativa ---------- */
  const header = $('#header');
  const top = () => header.offsetHeight;
  function spy() {
    if (!headings.length) return;
    let active = headings[0];
    for (const h of headings) { if (h.getBoundingClientRect().top <= top() + 40) active = h; else break; }
    if (innerHeight + scrollY >= document.documentElement.scrollHeight - 4) active = headings[headings.length - 1];
    $$('a', tocEl).forEach(a => a.dataset.h === active.id ? a.setAttribute('aria-current', 'true') : a.removeAttribute('aria-current'));
  }
  let ticking = false;
  addEventListener('scroll', () => { if (!ticking) { ticking = true; requestAnimationFrame(() => { ticking = false; spy(); }); } }, { passive: true });
  const syncTop = () => document.documentElement.style.setProperty('--top', top() + 'px');
  new ResizeObserver(syncTop).observe(header);
  syncTop();
  $('#banner button').addEventListener('click', () => { $('#banner').hidden = true; });

  /* ---------- Rotas ---------- */
  function route() {
    const [rawId, anchor] = decodeURIComponent(location.hash.replace(/^#\/?/, '')).split('::');
    const p = BY_ID.get(rawId || 'home') || HOME;
    const samePage = p.id === currentId;
    if (!samePage) render(p);
    closeNav();
    const target = anchor && document.getElementById(anchor);
    if (target) target.scrollIntoView();
    else if (!samePage) {
      scrollTo(0, 0);
      const h1 = $('.page-title', pageEl);
      if (h1) h1.focus({ preventScroll: true });
    }
    spy();
  }
  addEventListener('hashchange', route);
  document.addEventListener('click', e => {
    if (e.target.closest('[data-fake]')) e.preventDefault();
    if (e.target.closest('[data-open-search]')) openSearch();
    const inline = e.target.closest('.toc-inline a');
    if (inline) inline.closest('details').open = false;

    const caret = e.target.closest('.cp-caret'), menu = $('.cp-menu', pageEl);
    if (caret) { menu.hidden = !menu.hidden; caret.setAttribute('aria-expanded', !menu.hidden); }
    else if (menu && !menu.hidden) { menu.hidden = true; $('.cp-caret', pageEl).setAttribute('aria-expanded', 'false'); }
    const cp = e.target.closest('.cp-main');
    if (cp) {
      try { navigator.clipboard.writeText($('.page-title', pageEl).textContent + '\n\n' + $('.prose', pageEl).innerText); } catch (err) {}
      cp.innerHTML = ico('check') + '<span>Copiado</span>';
      setTimeout(() => { cp.innerHTML = ico('copy') + '<span>Copiar página</span>'; }, 1600);
    }
    const fb = e.target.closest('.fb-btn');
    if (fb) { const box = fb.closest('.feedback'); $$('.fb-btn', box).forEach(b => b.remove()); $('.q', box).textContent = 'Obrigado pelo retorno.'; }
  });

  /* ---------- Menu no celular ---------- */
  const menuBtn = $('#menuBtn');
  function closeNav() { document.body.classList.remove('nav-open'); menuBtn.setAttribute('aria-expanded', 'false'); }
  menuBtn.addEventListener('click', () => {
    const open = document.body.classList.toggle('nav-open');
    menuBtn.setAttribute('aria-expanded', open);
  });
  $('#scrim').addEventListener('click', closeNav);

  /* ---------- Tema ---------- */
  const themeBtn = $('#themeBtn');
  function paintTheme() { themeBtn.innerHTML = ico(document.documentElement.dataset.theme === 'dark' ? 'sun' : 'moon'); }
  themeBtn.addEventListener('click', () => {
    const t = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
    document.documentElement.dataset.theme = t;
    try { localStorage.setItem('betterai-docs-theme', t); } catch (e) {}
    paintTheme();
  });
  paintTheme();

  /* ---------- Busca ---------- */
  const dialog = $('#search'), q = $('#q'), results = $('#results');
  const INDEX = [];
  for (const p of PAGES) {
    if (p.home) continue;
    const where = p.overview ? 'Visão geral da área' : [p.area.t, ...p.path].join(' / ');
    INDEX.push({ href: `#/${p.id}`, title: p.t, path: where, page: true });
    const tpl = $(`template[data-page="${p.id}"]`);
    if (tpl) $$('h2, h3', tpl.content).forEach(h => INDEX.push({ href: `#/${p.id}::${slug(h.textContent)}`, title: h.textContent, path: [p.area.t, ...p.path, p.t].join(' / ') }));
  }
  const fold = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
  function mark(text, term) {
    const i = term ? fold(text).indexOf(term) : -1;
    return i < 0 ? esc(text) : esc(text.slice(0, i)) + '<mark>' + esc(text.slice(i, i + term.length)) + '</mark>' + esc(text.slice(i + term.length));
  }
  let sel = 0;
  function search() {
    const term = fold(q.value.trim());
    let list, label = '';
    if (!term) {
      label = 'Sugestões';
      list = POPULAR.map(id => INDEX.find(x => x.href === `#/${id}`));
    } else {
      list = INDEX.map(x => {
        const t = fold(x.title), pth = fold(x.path);
        const score = t.startsWith(term) ? 0 : t.includes(term) ? 1 : pth.includes(term) ? 2 : -1;
        return { x, score: score < 0 ? -1 : score + (x.page ? 0 : .5) };
      }).filter(r => r.score >= 0).sort((a, b) => a.score - b.score).slice(0, 9).map(r => r.x);
    }
    sel = 0;
    results.innerHTML = list.length
      ? (label ? `<li class="results-label" role="presentation">${label}</li>` : '') +
        list.map((x, i) => `<li class="result" role="option" aria-selected="${i === 0}"><a href="${x.href}" tabindex="-1"><span class="r-title">${mark(x.title, term)}</span><span class="r-path">${mark(x.path, term)}</span></a></li>`).join('')
      : `<li class="no-results" role="presentation">Nada encontrado para “${esc(q.value.trim())}”. Tente o nome de um módulo, como “Pinecone”.</li>`;
  }
  function move(d) {
    const items = $$('.result', results);
    if (!items.length) return;
    sel = (sel + d + items.length) % items.length;
    items.forEach((li, i) => li.setAttribute('aria-selected', i === sel));
    items[sel].scrollIntoView({ block: 'nearest' });
  }
  function openSearch() { if (dialog.open) return; closeNav(); q.value = ''; search(); dialog.showModal(); q.focus(); }
  q.addEventListener('input', search);
  q.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown') { e.preventDefault(); move(1); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); move(-1); }
    else if (e.key === 'Enter') { e.preventDefault(); const a = $('.result[aria-selected="true"] a', results); if (a) { dialog.close(); location.hash = a.getAttribute('href'); } }
  });
  results.addEventListener('click', e => { if (e.target.closest('a')) dialog.close(); });
  dialog.addEventListener('click', e => { if (e.target === dialog) dialog.close(); });
  addEventListener('keydown', e => {
    const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
    if ((e.key.toLowerCase() === 'k' && (e.ctrlKey || e.metaKey)) || (e.key === '/' && !typing)) { e.preventDefault(); openSearch(); }
    if (e.key === 'Escape') closeNav();
  });

  route();
})();
</script>
</body>
</html>
