schema_3:
  - name: pontos_positivos
    type: str
    title: Pontos Positivos
    description: >
      Liste até 3 aspectos positivos que tornam o vídeo bom ou atraente.
      Pode incluir criatividade, clareza, engajamento, duração adequada,
      interação com o público, estética, entre outros.
    examples:
      - "Criatividade na apresentação; vídeo curto e dinâmico; boa interação com o público."

  - name: pontos_negativos
    type: str
    title: Pontos Negativos
    description: >
      Liste até 3 aspectos que podem dificultar a compreensão ou reduzir a qualidade do vídeo.
      Pode incluir áudio ruim, iluminação fraca, efeitos visuais excessivos,
      cortes confusos, entre outros.
    examples:
      - "Áudio um pouco abafado; iluminação irregular; cortes rápidos que podem confundir."

