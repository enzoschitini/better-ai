schema_1:
  - name: usuario
    type: str
    title: Usuário
    description: Nome do usuário que escreveu o texto
    examples:
      - João
      - Maria

  - name: comentario
    type: str
    title: Comentário
    description: Texto do comentário
    examples:
      - Gostei muito!
      - Não recomendo

  - name: likes
    type: int
    title: Curtidas
    description: Quantidade de likes
    examples:
      - 5
      - 12

  - name: sentimento
    type: bool
    title: Foi bom ou ruim?
    description: Diga se o comentário é positivo ou negativo
    examples:
      - true
      - false



