# Configuração do build. Lida com `tomllib` (stdlib no Python 3.12).

# A única URL que o build precisa saber, e só porque canonical, hreflang e
# sitemap exigem URL absoluta. Inclua o subcaminho, se houver.
#
# Todo link interno do site é relativo, então o site roda em qualquer ponto de
# montagem sem configuração: raiz de domínio, subpasta do GitHub Pages, ou
# aberto direto do disco. Se você renomear o repo ou apontar um domínio
# próprio, esta linha é a única que muda.
site_url = "https://enzoschitini.github.io/better-ai"

# Link "Fonte:" e "Editar no GitHub".
github_repo = "enzoschitini/better-ai"
github_branch = "main"

# Links do chrome.
swagger_url = "https://better-ai-production.up.railway.app/docs"

# Aviso no topo. Vazio = sem faixa.
banner = ""

[links]
# Coluna "Plataforma" do rodapé: rótulo = id de página.
"Web Service Network" = "modules/web-service-network/web-service-api"
"Acquarello" = "streamlit-applications/acquarello"
